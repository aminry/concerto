name: deny

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    env:
      # EmbarkStudios/cargo-deny-action@v1 hard-pins cargo-deny 0.14.21,
      # which cannot parse current RustSec advisories (CVSS 4.0). Install
      # a current release directly instead.
      DENY_VERSION: 0.19.7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/bin" "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cargo-deny" --version
      - run: cargo deny check
