name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
        if: matrix.os != 'windows-latest'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-latest'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build desktop frontend (Tauri build.rs requires Vite dist)
        if: matrix.os != 'windows-latest'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@v2
      # Cross-platform Core lanes (design/18 §3.3, design/00 §10):
      #   * macOS + Linux build/lint/test the FULL workspace, agent-host
      #     PTY/UDS bridge included (Linux Core is fully supported).
      #   * Windows builds/lints/tests the Core + portable crates,
      #     INCLUDING `concerto-agent-host`: its lib (CBOR wire format,
      #     ring buffer, frame codec, final-info) is cross-platform, and
      #     its Unix-only PTY/UDS supervisor is `#[cfg(unix)]`-gated to a
      #     ConPTY stub (Task 702 owns the real Windows backend). Its
      #     integration test cfg-gates to empty on Windows. So the Windows
      #     lane is honestly green, not green-by-skipping.
      #   * Windows STILL excludes four crates that are out of scope here:
      #     `concerto-desktop` (Tauri 2; Mac+Windows is a later desktop
      #     task — no Windows icons shipped yet), `concerto-smoke-client`,
      #     `concerto-test-harness` and `concerto-pair-serve` (all use
      #     `tokio::net::UnixStream` — UDS dev/test tooling). Per design/00 §10 Desktop is Mac+
      #     Windows only (no Linux desktop); the Linux lane builds it via
      #     the Tauri deps installed above.
      # arm64 runners are a Task 706 (release/signing matrix) concern; x64
      # is the cross-platform floor here.
      - name: cargo check
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo check --workspace --all-targets --exclude concerto-desktop --exclude concerto-smoke-client --exclude concerto-test-harness --exclude concerto-pair-serve
          else
            cargo check --workspace --all-targets
          fi
        shell: bash
      - name: cargo clippy
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo clippy --workspace --all-targets --exclude concerto-desktop --exclude concerto-smoke-client --exclude concerto-test-harness --exclude concerto-pair-serve -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
        shell: bash
      - name: cargo test
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --workspace --no-fail-fast --exclude concerto-desktop --exclude concerto-smoke-client --exclude concerto-test-harness --exclude concerto-pair-serve
          else
            cargo test --workspace --no-fail-fast
          fi
        shell: bash
      - name: Check interface summaries are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/regen-interfaces.sh
          git diff --exit-code docs/interfaces/
