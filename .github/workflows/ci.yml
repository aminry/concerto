name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
        if: matrix.os != 'windows-latest'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: matrix.os != 'windows-latest'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build desktop frontend (Tauri build.rs requires Vite dist)
        if: matrix.os != 'windows-latest'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@v2
      # Per tasks/README.md §2, V0.1 desktop is macOS-only and the V0.1
      # smoke gate runs on Linux/macOS only. `concerto-desktop` (Tauri 2;
      # needs icons/icon.ico we don't ship), `concerto-smoke-client`,
      # `concerto-test-harness` (both use `tokio::net::UnixStream` — UDS),
      # and `concerto-agent-host` (Task 21 — Unix-only PTY bridge; Windows
      # ConPTY support is V1.0 per design/04 §3.9) fail to compile on
      # Windows. Exclude them from Windows; macOS + Linux build the full
      # workspace.
      - name: cargo check
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo check --workspace --all-targets --exclude concerto-desktop --exclude concerto-smoke-client --exclude concerto-test-harness --exclude concerto-agent-host
          else
            cargo check --workspace --all-targets
          fi
        shell: bash
      - name: cargo clippy
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo clippy --workspace --all-targets --exclude concerto-desktop --exclude concerto-smoke-client --exclude concerto-test-harness --exclude concerto-agent-host -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
        shell: bash
      - name: cargo test
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --workspace --no-fail-fast --exclude concerto-desktop --exclude concerto-smoke-client --exclude concerto-test-harness --exclude concerto-agent-host
          else
            cargo test --workspace --no-fail-fast
          fi
        shell: bash
      - name: Check interface summaries are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/regen-interfaces.sh
          git diff --exit-code docs/interfaces/
