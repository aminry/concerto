[package]
name = "concerto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "concerto_core"
path = "src/lib.rs"

[[bin]]
name = "concerto-core"
path = "src/main.rs"

[dependencies]
concerto-error = { path = "../error" }
concerto-persist = { path = "../persist" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
home.workspace = true
fs2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Task 12: typed Actor trait + catch_unwind for the supervisor.
async-trait.workspace = true
futures.workspace = true

[target.'cfg(unix)'.dependencies]
# Used by pid_file to test whether a recorded PID is still alive via
# `kill(pid, 0)`. libc is already a transitive dep of tokio; pinning it
# explicitly here is cheap and avoids `unsafe` raw syscalls.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
# Task 12: `start_paused = true` requires tokio's `test-util` feature.
# Layered as a dev-dep so the prod binary doesn't pull in the testing
# clock primitives.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "test-util"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
