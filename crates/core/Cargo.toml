[package]
name = "concerto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "concerto_core"
path = "src/lib.rs"

[[bin]]
name = "concerto-core"
path = "src/main.rs"

# Task 50: Criterion benches measuring Core RSS at idle and under 8
# active agents (Task 50 pre-decisions 2 + 3). Gated behind the
# `mem-bench` Cargo feature so the bench files only compile when
# explicitly requested. `harness = false` defers test running to
# criterion's `criterion_main!` macro (same pattern as Task 29's
# `crates/gix-wrap/benches/status.rs`).
[[bench]]
name = "runtime_memory"
harness = false
required-features = ["mem-bench"]

[[bench]]
name = "runtime_8agents"
harness = false
required-features = ["mem-bench"]

[features]
# Task 50: opt-in feature that compiles the memory benches under
# `benches/runtime_*.rs`. Off by default — `cargo test` / `cargo build`
# don't pull in `criterion` or the test-harness dev-deps unless the
# caller asks for them via `cargo bench -p concerto-core --features
# mem-bench` (or the CI workflow does it explicitly).
mem-bench = []

[dependencies]
concerto-error = { path = "../error" }
concerto-persist = { path = "../persist" }
concerto-proto = { path = "../proto" }
# Task 18: shell-out + gix git operations live under `repo_manager`.
concerto-gix-wrap = { path = "../gix-wrap" }
uuid = { workspace = true }
# Task 19: workspace_manager opens a sqlx transaction on top of the
# persistence layer's writer connection to scope `workspaces` +
# `workspace_repos` inserts atomically. Brings in the `Connection`
# trait for `.begin()` and the typed-error inspection for unique
# constraint detection.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
home.workspace = true
fs2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Task 12: typed Actor trait + catch_unwind for the supervisor.
async-trait.workspace = true
futures.workspace = true
# Task 13: gRPC server over UDS.
#
# `tonic` server-side wants the transport + codegen + prost feature triplet;
# the workspace pin is `default-features = false` (see workspace Cargo.toml).
tonic = { workspace = true, features = ["transport", "codegen", "prost"] }
prost = { workspace = true }
prost-types = "0.13"
tower.workspace = true
hyper-util.workspace = true
tokio-stream = { workspace = true, features = ["net", "sync"] }
hostname.workspace = true
# Task 204: Connect-Web bridge. `GrpcWebLayer` wraps the same Tonic services
# the UDS server hosts so a browser-reachable loopback hyper server can serve
# gRPC-Web (+ SSE) over TCP. Workspace pin; cross-platform (no `#[cfg(unix)]`).
tonic-web = { workspace = true }
# Task 30: files-to-copy resolver.
ignore = { workspace = true }
pathdiff = { workspace = true }
# Task 33: regex-based parser packs for the Agent Supervisor's
# tool-approval boundary detection (terminal mode). See
# `agent_supervisor/parsers/claude_code.rs`.
regex = { workspace = true }
# Task 35: TOML parser for `~/.codex/config.toml`'s `[mcp_servers.*]`
# table. Promoted to a workspace dep so the version stays consistent.
toml = { workspace = true }
# Task 39: YAML frontmatter parser for `SKILL.md` files. Workspace pin.
serde_yaml = { workspace = true }
# Task 41: lexical path cleaning for the filesystem allow/deny
# policy. Workspace pin. Used as the fallback when
# `std::fs::canonicalize` fails (e.g. paths that don't exist yet).
path-clean = { workspace = true }
# Task 203: BLAKE2b-256 checksum for the `Files` service. The handler
# feeds the hasher incrementally as 256 KiB upload chunks arrive and
# verifies the digest on finalize. Workspace pin (introduced by Task 203;
# reused by Task 205).
blake2 = { workspace = true }
# Task 42: filesystem-watch crate driving the managed.json hot-reload
# watcher in `crates/core/src/security/managed.rs`. Workspace pin.
notify = { workspace = true }
# Task 45: VCS provider (`gh` CLI shell-out) writes PR title / body to
# temp files and passes `--title-file` / `--body-file` so newlines and
# backticks don't need shell escaping. `tempfile` is already vetted
# (dev-dep historically); promoted here to a production dep.
tempfile = "3"
# Task 112: `HttpsForwarderSubscriber` (audit pipeline) POSTs NDJSON
# events to a configured endpoint. rustls-tls backend (workspace pin) so
# it builds on the Windows CI lane and stays cargo-deny clean.
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Used by pid_file to test whether a recorded PID is still alive via
# `kill(pid, 0)`. libc is already a transitive dep of tokio; pinning it
# explicitly here is cheap and avoids `unsafe` raw syscalls.
libc = "0.2"
# Task 22: the Agent Supervisor reuses the host-side CBOR frame codec
# and HostFrame types instead of duplicating the wire format. The
# agent-host crate is unix-only (Windows ConPTY is V1.0), so the dep is
# gated on `cfg(unix)` here for symmetry.
concerto-agent-host = { path = "../agent-host" }
# Task 22: tokio's `process` feature backs `tokio::process::Command`,
# which the Agent Supervisor uses to spawn `concerto-agent-host` with a
# Unix `pre_exec` hook (`setsid()`) for detachment.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "process"] }
# Task 22: 32-byte session cookie generated via OS entropy.
getrandom = { workspace = true }
# Task 22: CBOR codec used to encode `Hello` frames sent to the host.
ciborium = "0.2"
# Task 22: hex-encode the cookie when passing it to the host as `--cookie`.
hex = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
# Task 204: the Connect-Web bridge integration test drives the loopback
# gRPC-Web server with a headless HTTP client. It reuses the workspace
# `reqwest` (rustls) pin but adds the `stream` feature so the test can read
# the `Streams.Subscribe` server-stream body chunk-by-chunk
# (`Response::bytes_stream`). Feature unification keeps the production build
# unchanged (production reqwest does not enable `stream`).
reqwest = { workspace = true, features = ["stream"] }
# Task 18: direct DB access in the repository_clone integration test —
# we seed a `projects` row before exercising `Repositories.AddRepository`
# because the `Projects` service does not exist until Task 19.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
# Task 12: `start_paused = true` requires tokio's `test-util` feature.
# Layered as a dev-dep so the prod binary doesn't pull in the testing
# clock primitives.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "test-util"] }
# Task 13: in-process gRPC client used by the integration test.
tonic = { workspace = true, features = ["transport", "codegen", "prost"] }
tower = { workspace = true }
hyper-util = { workspace = true }
prost-types = "0.13"
# Task 50: Criterion harness for the `mem-bench`-gated benches in
# `benches/runtime_memory.rs` + `benches/runtime_8agents.rs`. Same v0.5
# pin as `concerto-gix-wrap`. `html_reports` pulls in `plotters`
# (MIT/Apache-2.0) which is already vetted; CI runs the bench under
# `--features mem-bench` and `grep`s stdout for the budget line rather
# than parsing HTML reports.
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
# Task 17: integration tests for the gRPC server use the shared harness,
# which pulls in tokio::net::UnixStream. UDS is Unix-only; the V0.1
# Windows port stops at the build matrix (per tasks/README.md §2).
concerto-test-harness = { path = "../test-harness" }
# Task 22: `concerto-agent-host` binary path is resolved via
# `assert_cmd::cargo::cargo_bin` in the in-process agent-spawn test so
# the test doesn't depend on cwd or the binary being on `$PATH`.
assert_cmd = "2"
