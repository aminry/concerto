[package]
name = "concerto-error"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "concerto_error"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
# sqlx and tonic appear here so the boundary Error enum can carry boxed
# variants for their error types per design/00 §7.3. Workspace-level deps
# already have `default-features = false`; we only need the Error / Status
# types, not runtimes or transports.
sqlx.workspace = true
tonic.workspace = true
# concerto-keychain is a leaf crate (it depends on `thiserror`, `keyring`,
# `secrecy`, `tracing`, `tokio`) and explicitly does NOT depend on
# concerto-error, so this dep is acyclic. Carried for the
# `From<SecretsError>` bridge added in Task 10.
concerto-keychain = { path = "../keychain" }
