// Streams service — the single server-streaming RPC that surfaces all
// in-process event broadcasts to gRPC clients.
//
// Owned in design by `10_Local_API_Protocol.md` §3.2 and §5. V0.1 ships a
// minimal subject catalog (`session.events.<sid>`, `session.io.<sid>`,
// `workspace.events`, `workarea.events`) and ignores `since_offset` per
// the design doc's V0.1 row. Ring-buffer + ack + gap-detected semantics
// land in V1.0.
//
// Field numbers in this file are FROZEN as of Task 23. Phase 3 extends
// `SessionEvent.kind` (ToolCall, ToolResult, AwaitingApproval,
// CheckpointCreated, TurnComplete, ContextUsage, Error, Crashed) at
// higher numbers; the V0.1 oneof variants are immutable.
//
// Task 202 (V1.0, design/10 §3.3) makes `SubscribeRequest.since_offset`
// live and adds reconnect machinery additively (new field numbers ONLY,
// all above the existing 14): the `GapDetected` event variant
// (`Event.body.gap_detected = 15`) plus the `AckOffset` unary RPC and its
// `AckOffsetRequest` message. No existing field number is touched.
//
// Task 216 (V1.0, design/11 §5.3) adds the `TransportEvent` variant
// (`Event.body.transport = 16`) — the three (folded: four) transport
// lifecycle events (`session_opened` / `session_closed` / `relay_switched`
// / `nat_success_changed`) the Iroh transport broadcasts on the
// `transport.events` subject. Decision D1: there is NO `transport.proto`;
// transport telemetry rides this `Event` oneof. Field number 16 is the
// next free number above Task 202's `gap_detected = 15` — append-only,
// never reused/moved.
//
// Task 316 (V1.0, design/13 §5.3 + PHASE3_PLANNING §2) adds the opaque
// VCS-event carrier `Event.checks_opaque = 17`. Per the locked decision
// the `checks.<workarea_id>.<repository_id>` review-thread / check-run /
// deployment events do NOT get a new `body` oneof arm (the oneof is FROZEN
// through field 16). Instead they ride a NON-ONEOF `optional bytes` field
// (a sibling of the oneof) — every existing client ignores the unknown
// field and stays wire-compatible, while Task 324 parses the opaque frame.
// Field number 17 is the first free number on the `Event` message above the
// oneof's 16. The frame format is FROZEN here (see `checks_opaque`).

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "concerto/v1/suggestions.proto";

message SubscribeRequest {
  // Subject string from the locked catalog:
  //   session.events.<session_id>
  //   session.io.<session_id>
  //   workspace.events
  //   workarea.events
  string subject = 1;
  // Optional client-side filter expression. V0.1 ignores; reserved for
  // future predicate-based subscription.
  optional string filter = 2;
  // Resume cursor (design/10 §3.3). Task 202 makes this LIVE: when set,
  // the Core replays every retained event with `offset > since_offset`
  // from the per-subject ring buffer, then transitions to live. When the
  // requested offset is older than the buffer's retained floor, the Core
  // emits a single `Event { gap_detected }` as the FIRST frame and then
  // continues live from the current head (the client re-bootstraps the
  // subject via the list RPCs to fill the gap — see GapDetected). When
  // unset, behavior is unchanged from V0.1 (live-only, plus whatever
  // replay the supervisor already provides for session subjects).
  // In-memory only (§12 R-1): offsets do NOT survive a Core restart.
  optional uint64 since_offset = 3;
}

message Event {
  // Monotonic per-subject. Assigned at publish time; subscribers MUST
  // tolerate gaps under V1.0 ring-buffer overflow semantics (V0.1 does
  // not overflow).
  uint64 offset = 1;
  google.protobuf.Timestamp at = 2;
  oneof body {
    SessionEvent session = 10;
    SessionIoChunk session_io = 11;
    WorkspaceEvent workspace = 12;
    WorkareaEvent workarea = 13;
    // Task 40: rule-engine chip emission. Carried on the
    // `suggestion.events` subject (filter on workarea_id when set).
    Chip suggestion = 14;
    // Task 202 (design/10 §3.3, §8): the client's `since_offset` was
    // older than this subject's retained ring-buffer floor, so the gap
    // cannot be replayed. Emitted as the FIRST frame on such a Subscribe;
    // the stream then CONTINUES live from the current head (it does not
    // terminate). The client MUST re-bootstrap this subject via the list
    // RPCs (per §7.2) to fill the gap, then trust the live tail. Field
    // number 15 — additive above the FROZEN V0.1 range (10..14).
    GapDetected gap_detected = 15;
    // Task 216 (design/11 §5.3): a transport lifecycle event — a session
    // opened/closed, the relay switched, or the rolling NAT-success rate
    // materially changed. Carried on the `transport.events` subject; the
    // Desktop direct/via-relay badge + Settings→Diagnostics percentage
    // (design/11 §3.6) and the mobile/web clients key off it. Decision D1:
    // NO separate `transport.proto` — transport telemetry rides this oneof.
    // Field number 16 — additive above Task 202's `gap_detected = 15`.
    TransportEvent transport = 16;
  }
  // Task 316 (design/13 §5.3, PHASE3_PLANNING §2): the opaque VCS-event
  // carrier for the `checks.<workarea_id>.<repository_id>` subject. This is
  // a NON-ONEOF field (a sibling of `body`, NOT a oneof arm) so the FROZEN
  // `body` oneof stays untouched (frozen through field 16) and every
  // existing client ignores it. Set ONLY on `checks.<wa>.<repo>` events
  // (the `body` oneof is then empty); the per-subject pump tolerates a
  // body-less Event carrying only this field (offset/at are separate).
  //
  // FROZEN frame format (Task 324 parses it): a deterministic JSON object
  //   {
  //     "kind": "thread_updated" | "check_run_updated" | "deployment_updated",
  //     "workarea_id":   "<workarea uuid>",
  //     "repository_id": "<repository uuid>",
  //     "entity": { ...the changed thread / check-run set / deployment set }
  //   }
  // where, by `kind`, `entity` is:
  //   thread_updated:     { "id": "<thread node id>", "resolved": <bool>,
  //                         "path": "<file path>" | null,
  //                         "comments": ["<body>", ...] }
  //   check_run_updated:  { "sha": "<head sha>",
  //                         "runs": [ { "name", "status", "conclusion",
  //                                     "details_url" }, ... ] }
  //   deployment_updated: { "ref": "<git ref/sha>",
  //                         "deployments": [ { "id", "environment", "state",
  //                                            "ref" }, ... ] }
  // JSON (not CBOR) matches the human-readable, schema-light shape the rest
  // of the streams surface uses; the field is `bytes` so the frame can
  // evolve additively without a proto change. Field 17 — first free number
  // on `Event`, additive above the oneof's 16.
  optional bytes checks_opaque = 17;
}

// Task 216 (design/11 §5.3): one of the four transport lifecycle events the
// Iroh transport (Task 212) broadcasts as it observes sessions come and go,
// the relay change, and the rolling NAT-success rate move. The migration
// contract (design/11 §3.7, §7.4) is FROZEN in the wire shape: a client
// network change (Wi-Fi<->LTE) updates the live session's `path` via
// `RelaySwitched`/no event but does NOT emit `SessionClosed` — only a true
// connection drop does, so a subscriber survives the ~1-3s migration blip.
message TransportEvent {
  oneof kind {
    // A device established a session (design/11 §5.3 `transport.session_opened`).
    SessionOpened session_opened = 1;
    // A device disconnected — a TRUE connection drop, NOT a path migration
    // (design/11 §5.3 `transport.session_closed`). Folded in per the task's
    // §5.3 note (it is broadcast too).
    SessionClosed session_closed = 2;
    // The relay URL the Core registers with changed (design/11 §5.3
    // `transport.relay_switched`).
    RelaySwitched relay_switched = 3;
    // The rolling 1-hour NAT-success (direct-%) rate materially changed
    // (design/11 §5.3 `transport.nat_success_changed`). Debounced — fires
    // only on a meaningful delta or a crossing of the >70% PRD line
    // (design/11 §3.6), never per connection.
    NatSuccessChanged nat_success_changed = 4;
  }
}

// How a session's QUIC traffic reaches the peer (mirrors the Rust
// `concerto_transport::ConnectionPath`, design/11 §4). FROZEN value set.
enum TransportPath {
  TRANSPORT_PATH_UNSPECIFIED = 0;
  // Hole-punched direct path over a public/routable IP (NAT traversal won).
  TRANSPORT_PATH_DIRECT = 1;
  // Relayed QUIC through the configured relay (hole-punch fell back).
  TRANSPORT_PATH_RELAYED = 2;
  // LAN-direct over a loopback / private-range IP (mDNS-discovered), no relay.
  TRANSPORT_PATH_LAN = 3;
}

// The kind of client a session belongs to (design/11 §2). NAT-success is
// broken out by this so we can see whether split-host Desktops (mostly
// residential<->residential or residential<->cloud-VM) get worse direct
// rates than mobile. FROZEN value set { desktop-split-host, mobile, web }.
enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  // Split-host Desktop (Tauri shell on a different machine from the Core),
  // over Iroh (design/11 §3.1).
  CLIENT_KIND_DESKTOP_SPLIT_HOST = 1;
  // Mobile (iOS / Android via the RN Iroh native module), over Iroh.
  CLIENT_KIND_MOBILE = 2;
  // Web (browser), reaching the Core via the WSS bridge (Task 215).
  CLIENT_KIND_WEB = 3;
}

// Task 216 (design/11 §5.3 `transport.session_opened`): a device came up.
message SessionOpened {
  // The device id (the transport's session key).
  string device_id = 1;
  // The classified path this session came up on.
  TransportPath path = 2;
  // The kind of client (drives the by-client-kind NAT breakdown).
  ClientKind client_kind = 3;
}

// Task 216 (design/11 §5.3 `transport.session_closed`): a TRUE connection
// drop (NOT a path migration). The client reconnects + replays from offset
// via the Task-202 ring buffer.
message SessionClosed {
  // The device id whose session dropped.
  string device_id = 1;
}

// Task 216 (design/11 §5.3 `transport.relay_switched`): the relay URL changed.
message RelaySwitched {
  // The relay URL the Core now uses; empty under `disable_remote` / no relay.
  string relay_url = 1;
}

// Task 216 (design/11 §5.3 `transport.nat_success_changed`): the rolling
// 1-hour direct-connection percentage moved materially (debounced — see
// `TransportEvent.nat_success_changed`).
message NatSuccessChanged {
  // The new rolling direct-% over the last hour, 0..=100.
  uint32 direct_percent = 1;
}

// Task 202: emitted when a `Subscribe { since_offset = N }` cannot be
// satisfied from the per-subject ring buffer because `N` is older than
// `buffer_floor - 1` (the oldest still-retained offset). Carries the
// subject and the current floor so the client knows exactly which
// subject to re-bootstrap and where the live tail picks up. The stream
// continues live from the head after this frame (continue-live-from-head
// semantics — FROZEN by Task 202; the alternative, terminating the
// stream, was rejected so a reconnecting client gets the live tail on
// the same RPC without a second round-trip).
message GapDetected {
  // The subject whose history overflowed past the requested offset
  // (echoes `SubscribeRequest.subject`).
  string subject = 1;
  // The lowest offset still retained in the ring buffer at the moment of
  // detection. Events with `offset < buffer_floor` are gone; the client
  // re-bootstraps and then trusts live frames (whose offset >= floor).
  uint64 buffer_floor = 2;
}

message SessionEvent {
  string session_id = 1;
  oneof kind {
    AgentStarted started = 10;
    AgentMessage message = 11;
    AgentExited exited = 12;
    // Task 33: tool-approval boundary detection. The parser pack saw the
    // agent CLI pause for a tool-approval prompt and the
    // `PermissionResolver` returned `MustAsk` — clients show the prompt
    // and call `Sessions.ResolveApproval` to send the decision back.
    AwaitingApproval awaiting_approval = 13;
    // Task 33: the matching `ResolveApproval` succeeded (auto or manual).
    ApprovalResolved approval_resolved = 14;
    // Task 33: parsed tool call — for V0.1 the parser packs emit this as
    // a sibling of `AwaitingApproval`; V1.0 may differentiate
    // request/result frames.
    ToolCall tool_call = 15;
    // Task 33: the agent finished a turn (per the parser pack's
    // detection). V0.1 is best-effort: terminal parsers may miss the
    // boundary; structured parsers (V1.0) are authoritative.
    TurnComplete turn_complete = 16;
    // Task 34: per-repo checkpoint created at the end of a turn. Multi
    // repo workareas fire one per repo (V1.0); V0.1 single-repo
    // workareas always fire exactly one.
    CheckpointCreated checkpoint_created = 17;
  }
}

message AgentStarted {
  string model = 1;
  string mode = 2;
}

message AgentMessage {
  string role = 1;
  bytes  content = 2;
}

message AgentExited {
  optional int32 exit_code = 1;
}

// Task 33: an approval gate fired. `approval_id` is the
// `tool_approvals.id` row freshly persisted; clients call
// `Sessions.ResolveApproval(approval_id, decision)` to resolve it.
// `summary` is a short human-readable rendering of the pending tool
// call ("write to foo.rs"); `payload_json` is the parser-pack-derived
// structured payload (V0.1: opaque object; V1.0: a per-CLI shape).
message AwaitingApproval {
  string approval_id = 1;
  string tool = 2;
  string summary = 3;
  string payload_json = 4;
  // Task 43: the destructive-command intercept fired for this gate.
  // Clients render the prompt with red-urgent styling. Field number is
  // FROZEN.
  bool urgent = 5;
  // Task 43: human-readable destructive-pattern label
  // (`"force-push"`, `"recursive-delete"`, …). Unset when the gate
  // fired for a non-destructive reason. Field number is FROZEN.
  optional string destructive_label = 6;
}

// Task 33: an approval has been resolved (auto or manual). `decision`
// mirrors the `tool_approvals.decision` column values.
message ApprovalResolved {
  string approval_id = 1;
  string tool = 2;
  // `approve | approve_once | deny | auto_strict | auto_normal | auto_auto | auto_yolo`
  string decision = 3;
}

// Task 33: a parsed tool call. `call_id` is the parser-pack-assigned
// correlation token; `args_json` is the raw JSON payload.
message ToolCall {
  string call_id = 1;
  string name = 2;
  string args_json = 3;
}

// Task 33: marker that the agent finished a turn (parser-pack
// detection). Currently carries no payload; V1.0 may add context-usage
// fields.
message TurnComplete {
}

// Task 34: a per-repo checkpoint was committed. `checkpoint_id` is the
// `checkpoints.id` row freshly persisted; `git_ref` is the FROZEN
// `refs/concerto/checkpoints/<workarea>/<repository>/<n>` form so the
// client can `git rev-parse` the ref if desired.
message CheckpointCreated {
  string checkpoint_id = 1;
  string git_ref = 2;
}

message SessionIoChunk {
  string session_id = 1;
  // "stdout" | "stderr".
  string stream = 2;
  bytes  data = 3;
}

// Minimal V0.1 set: `created` / `archived`. Phase 3 adds richer payloads.
message WorkspaceEvent {
  string workspace_id = 1;
  // "created" | "archived"
  string kind = 2;
}

message WorkareaEvent {
  string workarea_id = 1;
  // "created" | "archived"
  string kind = 2;
}

// Task 202: acknowledge that the calling subscriber has durably consumed
// every event for `subject` up to and including `offset`. The Core
// records this per-subscriber watermark in memory and prunes the
// subject's ring buffer to `min(acked offset across all still-attached
// subscribers)` — never dropping an event a live subscriber has not yet
// acked. This is the Connect-Web fallback path (design/10 §3.2, R-2):
// clients that can't ack in-stream poll this unary RPC. The bidi
// in-stream `ClientFrame { ack }` path lands with the Connect-Web client
// in Phase 5 (Task 520).
message AckOffsetRequest {
  string subject = 1;
  uint64 offset = 2;
}

service Streams {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc AckOffset(AckOffsetRequest) returns (google.protobuf.Empty);
}
