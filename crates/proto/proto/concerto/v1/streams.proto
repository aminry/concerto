// Streams service — the single server-streaming RPC that surfaces all
// in-process event broadcasts to gRPC clients.
//
// Owned in design by `10_Local_API_Protocol.md` §3.2 and §5. V0.1 ships a
// minimal subject catalog (`session.events.<sid>`, `session.io.<sid>`,
// `workspace.events`, `workarea.events`) and ignores `since_offset` per
// the design doc's V0.1 row. Ring-buffer + ack + gap-detected semantics
// land in V1.0.
//
// Field numbers in this file are FROZEN as of Task 23. Phase 3 extends
// `SessionEvent.kind` (ToolCall, ToolResult, AwaitingApproval,
// CheckpointCreated, TurnComplete, ContextUsage, Error, Crashed) at
// higher numbers; the V0.1 oneof variants are immutable.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/timestamp.proto";
import "concerto/v1/suggestions.proto";

message SubscribeRequest {
  // Subject string from the locked catalog:
  //   session.events.<session_id>
  //   session.io.<session_id>
  //   workspace.events
  //   workarea.events
  string subject = 1;
  // Optional client-side filter expression. V0.1 ignores; reserved for
  // future predicate-based subscription.
  optional string filter = 2;
  // V0.1 ignores. Ring-buffer + resume semantics arrive in V1.0; the
  // field is reserved so the wire shape is stable across that change.
  optional uint64 since_offset = 3;
}

message Event {
  // Monotonic per-subject. Assigned at publish time; subscribers MUST
  // tolerate gaps under V1.0 ring-buffer overflow semantics (V0.1 does
  // not overflow).
  uint64 offset = 1;
  google.protobuf.Timestamp at = 2;
  oneof body {
    SessionEvent session = 10;
    SessionIoChunk session_io = 11;
    WorkspaceEvent workspace = 12;
    WorkareaEvent workarea = 13;
    // Task 40: rule-engine chip emission. Carried on the
    // `suggestion.events` subject (filter on workarea_id when set).
    Chip suggestion = 14;
  }
}

message SessionEvent {
  string session_id = 1;
  oneof kind {
    AgentStarted started = 10;
    AgentMessage message = 11;
    AgentExited exited = 12;
    // Task 33: tool-approval boundary detection. The parser pack saw the
    // agent CLI pause for a tool-approval prompt and the
    // `PermissionResolver` returned `MustAsk` — clients show the prompt
    // and call `Sessions.ResolveApproval` to send the decision back.
    AwaitingApproval awaiting_approval = 13;
    // Task 33: the matching `ResolveApproval` succeeded (auto or manual).
    ApprovalResolved approval_resolved = 14;
    // Task 33: parsed tool call — for V0.1 the parser packs emit this as
    // a sibling of `AwaitingApproval`; V1.0 may differentiate
    // request/result frames.
    ToolCall tool_call = 15;
    // Task 33: the agent finished a turn (per the parser pack's
    // detection). V0.1 is best-effort: terminal parsers may miss the
    // boundary; structured parsers (V1.0) are authoritative.
    TurnComplete turn_complete = 16;
    // Task 34: per-repo checkpoint created at the end of a turn. Multi
    // repo workareas fire one per repo (V1.0); V0.1 single-repo
    // workareas always fire exactly one.
    CheckpointCreated checkpoint_created = 17;
  }
}

message AgentStarted {
  string model = 1;
  string mode = 2;
}

message AgentMessage {
  string role = 1;
  bytes  content = 2;
}

message AgentExited {
  optional int32 exit_code = 1;
}

// Task 33: an approval gate fired. `approval_id` is the
// `tool_approvals.id` row freshly persisted; clients call
// `Sessions.ResolveApproval(approval_id, decision)` to resolve it.
// `summary` is a short human-readable rendering of the pending tool
// call ("write to foo.rs"); `payload_json` is the parser-pack-derived
// structured payload (V0.1: opaque object; V1.0: a per-CLI shape).
message AwaitingApproval {
  string approval_id = 1;
  string tool = 2;
  string summary = 3;
  string payload_json = 4;
  // Task 43: the destructive-command intercept fired for this gate.
  // Clients render the prompt with red-urgent styling. Field number is
  // FROZEN.
  bool urgent = 5;
  // Task 43: human-readable destructive-pattern label
  // (`"force-push"`, `"recursive-delete"`, …). Unset when the gate
  // fired for a non-destructive reason. Field number is FROZEN.
  optional string destructive_label = 6;
}

// Task 33: an approval has been resolved (auto or manual). `decision`
// mirrors the `tool_approvals.decision` column values.
message ApprovalResolved {
  string approval_id = 1;
  string tool = 2;
  // `approve | approve_once | deny | auto_strict | auto_normal | auto_auto | auto_yolo`
  string decision = 3;
}

// Task 33: a parsed tool call. `call_id` is the parser-pack-assigned
// correlation token; `args_json` is the raw JSON payload.
message ToolCall {
  string call_id = 1;
  string name = 2;
  string args_json = 3;
}

// Task 33: marker that the agent finished a turn (parser-pack
// detection). Currently carries no payload; V1.0 may add context-usage
// fields.
message TurnComplete {
}

// Task 34: a per-repo checkpoint was committed. `checkpoint_id` is the
// `checkpoints.id` row freshly persisted; `git_ref` is the FROZEN
// `refs/concerto/checkpoints/<workarea>/<repository>/<n>` form so the
// client can `git rev-parse` the ref if desired.
message CheckpointCreated {
  string checkpoint_id = 1;
  string git_ref = 2;
}

message SessionIoChunk {
  string session_id = 1;
  // "stdout" | "stderr".
  string stream = 2;
  bytes  data = 3;
}

// Minimal V0.1 set: `created` / `archived`. Phase 3 adds richer payloads.
message WorkspaceEvent {
  string workspace_id = 1;
  // "created" | "archived"
  string kind = 2;
}

message WorkareaEvent {
  string workarea_id = 1;
  // "created" | "archived"
  string kind = 2;
}

service Streams {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}
