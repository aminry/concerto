// Workarea entity shape + service surface.
//
// Workareas are on-disk attempts (one workspace → 1..N workareas; see
// design/03 and design/09 §4.1). Task 07 locked the `Workarea` message;
// Task 20 adds the `Workareas` service (Create / Get / List / Archive)
// plus the `WorkareaId`, `CreateWorkareaRequest`, `ListWorkareasRequest`,
// and `ListWorkareasResponse` messages.
//
// V0.1 ships single-repo workareas (mirroring single-repo workspaces from
// Task 19); the schema permits N repos via the `workarea_repos` junction
// table for V1.0.
//
// `status` and `permission_mode` are intentionally string and enum
// respectively for V0.1; per the task spec, `status` may be promoted to
// an enum in a later revision.
//
// Field numbers in this file are FROZEN as of Task 20.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "concerto/v1/common.proto";
import "concerto/v1/vcs.proto";

message Workarea {
  string id = 1;
  string workspace_id = 2;
  string composer_name = 3;
  string branch_name = 4;
  string worktree_root = 5;
  // status ∈ { created | active | running | awaiting | paused | finished | partial | archived | crashed }
  // (Task 307 widened the set with `finished` + `partial`; `partial` = a
  // multi-repo workarea where >=1 repo's `git worktree add` failed.)
  // Still a string (not promoted to an enum) per the message note above.
  string status = 6;
  optional PermissionMode permission_mode = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp last_activity_at = 9;
  optional google.protobuf.Timestamp archived_at = 10;
  // Task 311: the derived-settings-key projection of
  // `workareas.settings_json.exclude_from_maestro` (design/03 §3.14). Source
  // of truth is the JSON key in `settings_json`; this typed bool is derived in
  // `workarea_to_proto` (absent/false/malformed ⇒ false). `optional` so a
  // future "unknown" state is representable, matching `permission_mode`.
  // Maestro (Task 413, Phase 4) reads it to blank an excluded workarea's
  // chat summaries; this task ships only the toggle + storage + typed read.
  optional bool exclude_from_maestro = 11;
}

// Identifier-only request payload reused by Get/Archive. Wraps the
// workarea primary key as a TEXT (UUIDv7).
message WorkareaId {
  string value = 1;
}

// Inputs for `Workareas.CreateWorkarea`. The server allocates the
// composer name (lowest-index unused in the workspace's pool), derives
// the branch name `concerto/<composer>`, runs `git worktree add` for the
// workspace's repo, and lays down the `.context/` skeleton per
// `design/03 §4.2`.
//
// V0.1 ships single-repo workareas — `workspace_id` must reference a
// workspace whose `workspace_repos` set has exactly one row.
message CreateWorkareaRequest {
  string workspace_id = 1;
  optional PermissionMode permission_mode = 2;
}

// Inputs for `Workareas.ListWorkareas`. V0.1 scopes the listing to one
// workspace and exposes the include-archived knob the UI needs from day
// one. Pagination lands at higher field numbers when needed.
message ListWorkareasRequest {
  string workspace_id = 1;
  bool include_archived = 2;
}

message ListWorkareasResponse {
  repeated Workarea workareas = 1;
}

// Task 29: structured diff payload for `Workareas.GetWorkareaRepoDiff`.
// Field numbers FROZEN as of Task 29; mirrors the Rust types in
// `concerto-gix-wrap` so the handler conversion is mechanical.

message DiffPayload {
  repeated FileDiff files = 1;
}

message FileDiff {
  string path = 1;
  DiffKind kind = 2;
  optional string old_path = 3;
  repeated DiffHunk hunks = 4;
}

message DiffHunk {
  int32 old_start = 1;
  int32 old_lines = 2;
  int32 new_start = 3;
  int32 new_lines = 4;
  // Unified-diff body lines (`+`, `-`, space-prefixed) for this hunk,
  // joined with `\n`. Hunk header is NOT included — the four range
  // fields above carry that information.
  string body = 5;
}

enum DiffKind {
  DIFF_KIND_UNSPECIFIED = 0;
  DIFF_KIND_ADDED = 1;
  DIFF_KIND_DELETED = 2;
  DIFF_KIND_MODIFIED = 3;
  DIFF_KIND_RENAMED = 4;
}

// Inputs for `Workareas.GetWorkareaRepoDiff`. Identifies a (workarea,
// repository) pair; the server resolves the repo's worktree under the
// workarea and diffs the worktree against HEAD.
message GetDiffRequest {
  string workarea_id = 1;
  string repository_id = 2;
}

// Task 31: inputs for `Workareas.ArchiveWorkareaWithOpts`. The boolean
// `remove_worktree` toggles whether the per-repo `git worktree remove`
// + workarea-root teardown runs; default `false` keeps the worktree on
// disk per design/03 R-5 (fast restore).
message ArchiveWorkareaRequest {
  string workarea_id = 1;
  bool remove_worktree = 2;
}

// Task 32: inputs for `Workareas.UpdateWorkareaPermissionMode`.
// `permission_mode` is REQUIRED (omit the message → INVALID_ARGUMENT).
// `acknowledgement` MUST equal the literal `"I understand"` when
// `permission_mode = PERMISSION_MODE_YOLO`; the server rejects with
// `FAILED_PRECONDITION` otherwise. For other modes the field is
// ignored.
//
// Setting `permission_mode = PERMISSION_MODE_UNSPECIFIED` clears the
// row's override (inherit from workspace). The acknowledgement field is
// not required to clear.
message UpdateWorkareaPermissionModeRequest {
  string workarea_id = 1;
  PermissionMode permission_mode = 2;
  string acknowledgement = 3;
}

// Task 32: inputs for `Workareas.SetWorkareaBypassDestructiveGuard`.
// `acknowledgement` MUST equal the literal `"I understand the risks"`
// when `enable = true`; ignored when `enable = false`. Server rejects
// with `FAILED_PRECONDITION` on a missing/wrong acknowledgement, and
// with `PERMISSION_DENIED` (`policy.locked`) when `managed.json`
// disallows the flag.
message SetWorkareaBypassDestructiveGuardRequest {
  string workarea_id = 1;
  bool enable = 2;
  string acknowledgement = 3;
}

// Task 45: response shape for `Workareas.GetWorkareaPrSet`. The
// workarea's PR set is the implicit set of `pull_requests` rows
// keyed by `workarea_id` (design/13 §4). V0.1 single-repo workareas
// have 0 or 1 entries; V1.0 multi-repo workareas may have more.
message GetWorkareaPrSetResponse {
  repeated PullRequest pull_requests = 1;
}

// Task 319: inputs for `Workareas.SetMergeOrder`. Identifies one PR within a
// workarea's implicit PR set by its `(workarea_id, repository_id)` key — the
// FROZEN `UNIQUE(workarea_id, repository_id)` invariant — and writes its new
// `merge_order`. Returns the re-ordered `GetWorkareaPrSetResponse` so the
// caller (Task 324's drag UI) re-renders from the authoritative order in one
// round-trip. No dependency-graph inference; ordering is pure insertion-order
// + this manual reorder (`PHASE3_PLANNING.md D7`).
message SetMergeOrderRequest {
  string workarea_id = 1;
  string repository_id = 2;
  int64 merge_order = 3;
}

// Task 320: the read-only coordinated-merge preview (`design/03 §5.1`/§3.9).
// The ordered `(repo, PR)` tuple list derived from `merge_order` — the plan the
// UI renders and the merge loop iterates. Field numbers FROZEN as of Task 320.
message MergePlan {
  string workarea_id = 1;
  repeated MergeStep steps = 2;
}

// One member of a [MergePlan]: a single `(repository, PR)` step. `step`/`total`
// are 1-based positional indices over the sorted set; `merge_order` is the raw
// (possibly negative / non-contiguous) order Task 319's `SetMergeOrder` wrote.
message MergeStep {
  int32 step = 1;
  int32 total = 2;
  string repository_id = 3;
  string repository_full_name = 4;
  int64 pr_number = 5;
  string head_sha = 6;
  int64 merge_order = 7;
  string state = 8;
}

// Task 320: inputs for `Workareas.MergeWorkareaPrSet`. `method` ∈
// `merge|squash|rebase` (empty ⇒ `merge`); `timeout_secs` 0 ⇒ the default 600
// (10 min). `allow_failing_checks` (the `design/03/13 R-6` merge-anyway-despite-
// red override) is gated by `managed.json`'s `allowMergeWithFailingChecks`; when
// the policy forbids it, the server rejects with `PERMISSION_DENIED`
// (`policy.locked`).
message MergeWorkareaPrSetRequest {
  string workarea_id = 1;
  string method = 2;
  uint64 timeout_secs = 3;
  bool allow_failing_checks = 4;
}

// Task 320: a single frame on the `MergeWorkareaPrSet` server-stream. The loop
// emits `step_started` → `step_completed` per merged member, `set_merged` on
// full success, or `step_failed` + `set_paused` when a member's checks fail /
// time out (pause-on-fail — the loop stops, does NOT auto-revert).
message MergeProgress {
  oneof event {
    MergeStepStarted step_started = 1;
    MergeStepCompleted step_completed = 2;
    MergeStepFailed step_failed = 3;
    MergeSetMerged set_merged = 4;
    MergeSetPaused set_paused = 5;
  }
}

message MergeStepStarted {
  int32 step = 1;
  int32 total = 2;
  string repository_full_name = 3;
  int64 pr_number = 4;
}

message MergeStepCompleted {
  int32 step = 1;
  int32 total = 2;
  string merge_sha = 3;
}

message MergeStepFailed {
  int32 step = 1;
  int32 total = 2;
  string reason = 3;
  FailureKind kind = 4;
}

message MergeSetMerged {
  int32 total = 1;
}

message MergeSetPaused {
  int32 paused_at_step = 1;
  int32 total = 2;
  string reason = 3;
}

// Why a coordinated merge step failed (`design/13 §8`). Drives the UI's
// "Step N of M failed — auto-revert?" surface (Task 324).
enum FailureKind {
  FAILURE_KIND_UNSPECIFIED = 0;
  FAILURE_KIND_CHECKS_FAILED = 1;
  FAILURE_KIND_CHECKS_TIMEOUT = 2;
  FAILURE_KIND_MERGE_CONFLICT = 3;
  FAILURE_KIND_MERGE_REJECTED = 4;
}

// Task 320: inputs for `Workareas.RevertWorkareaPrSet`. `hard_reset` opts into
// the hard-reset strategy (`design/13 R-5`); default is revert-commit.
message RevertWorkareaPrSetRequest {
  string workarea_id = 1;
  bool hard_reset = 2;
}

// Task 311: inputs for `Workareas.SetWorkareaExcludeFromMaestro`. Sets (or
// clears) the per-workarea privacy toggle stored in
// `workareas.settings_json.exclude_from_maestro` (design/03 §3.14). The write
// is a read-modify-write that preserves all other `settings_json` keys.
message SetWorkareaExcludeFromMaestroRequest {
  string workarea_id = 1;
  bool exclude = 2;
}

// Task 320: per-member outcome of a coordinated revert (`design/13 §3.5`). The
// set is walked in REVERSE `merge_order`; only merged members are revertible
// (un-merged members record `SKIPPED`). A partial revert does not abort the rest.
message RevertReport {
  string workarea_id = 1;
  repeated RevertStep steps = 2;
}

message RevertStep {
  string repository_full_name = 1;
  int64 pr_number = 2;
  RevertOutcome outcome = 3;
  string detail = 4;
}

enum RevertOutcome {
  REVERT_OUTCOME_UNSPECIFIED = 0;
  REVERT_OUTCOME_REVERTED = 1;
  REVERT_OUTCOME_SKIPPED = 2;
  REVERT_OUTCOME_FAILED = 3;
}

service Workareas {
  rpc CreateWorkarea(CreateWorkareaRequest) returns (Workarea);
  rpc GetWorkarea(WorkareaId) returns (Workarea);
  rpc ListWorkareas(ListWorkareasRequest) returns (ListWorkareasResponse);
  rpc ArchiveWorkarea(WorkareaId) returns (google.protobuf.Empty);
  // Task 29: hot-path diff. Returns the structured worktree-vs-HEAD
  // diff for one repo inside a workarea.
  rpc GetWorkareaRepoDiff(GetDiffRequest) returns (DiffPayload);
  // Task 31: archive + restore lifecycle.
  //
  // `ArchiveWorkareaWithOpts` exposes the `remove_worktree` knob; the
  // legacy `ArchiveWorkarea(WorkareaId)` is kept for back-compat
  // (default opts = keep worktree).
  rpc ArchiveWorkareaWithOpts(ArchiveWorkareaRequest) returns (google.protobuf.Empty);
  rpc RestoreWorkarea(WorkareaId) returns (Workarea);
  // Task 32: change `workareas.permission_mode` with entry-ceremony +
  // managed.json cap enforcement. Returns the updated `Workarea` row.
  rpc UpdateWorkareaPermissionMode(UpdateWorkareaPermissionModeRequest) returns (Workarea);
  // Task 32: toggle `workareas.bypass_destructive_guard` with
  // entry-ceremony + managed.json policy enforcement. Returns the
  // updated `Workarea` row.
  rpc SetWorkareaBypassDestructiveGuard(SetWorkareaBypassDestructiveGuardRequest) returns (Workarea);
  // Task 45/319: list every cached PR row for this workarea (implicit PR
  // set per `design/13 §4`), ordered `(merge_order, pr_number)`. Task 319
  // fulfilled the V0.1 promise that merge ordering is V1.0.
  rpc GetWorkareaPrSet(WorkareaId) returns (GetWorkareaPrSetResponse);
  // Task 319: set one PR's `merge_order` within its workarea's PR set and
  // return the re-ordered set. The coordinated merge/revert RPCs
  // (`GetWorkareaMergePlan` / `MergeWorkareaPrSet` / `RevertWorkareaPrSet`)
  // are RESERVED for Task 320.
  rpc SetMergeOrder(SetMergeOrderRequest) returns (GetWorkareaPrSetResponse);
  // Task 320: coordinated PR-set merge/revert (`design/03 §5.1`/§6.4,
  // `design/13 §3.5`). The loop lives on the `WorkareaManager` (NOT the VCS
  // layer, NOT the Scheduler): ordered merge → `wait_for_check_runs(post-merge
  // SHA, 10m)` → continue / pause-on-fail surfaced over the `MergeProgress`
  // stream as "Step N of M failed". Coordinated revert walks the merged members
  // in reverse `merge_order` (revert-commit default; `hard_reset` opt-in).
  rpc GetWorkareaMergePlan(WorkareaId) returns (MergePlan);
  rpc MergeWorkareaPrSet(MergeWorkareaPrSetRequest) returns (stream MergeProgress);
  rpc RevertWorkareaPrSet(RevertWorkareaPrSetRequest) returns (RevertReport);
  // Task 311: set the per-workarea `exclude_from_maestro` privacy toggle
  // (stored in `workareas.settings_json`; design/03 §3.14) and return the
  // updated `Workarea` with the derived `exclude_from_maestro` field set.
  rpc SetWorkareaExcludeFromMaestro(SetWorkareaExcludeFromMaestroRequest) returns (Workarea);
}
