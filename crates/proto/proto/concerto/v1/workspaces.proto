// Workspace entity shape + service surface.
//
// Workspaces are logical workstreams owning 1..N workareas (see design/03
// and design/09 §4.1). Task 07 locked the `Workspace` message; Task 19
// adds the `Workspaces` service (Create / Get / List / Archive) plus the
// `WorkspaceId`, `CreateWorkspaceRequest`, `ListWorkspacesRequest`, and
// `ListWorkspacesResponse` messages.
//
// Field numbers re-locked 2026-06-08 (Project→Workspace collapse).

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "concerto/v1/common.proto";

message Workspace {
  string id = 1;
  string name = 2;
  string slug = 3;
  optional string icon = 4;
  optional string description = 5;
  optional PermissionMode permission_mode = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp archived_at = 8;
}

// Identifier-only request payload reused by Get/Archive. Wraps the
// workspace primary key as a TEXT (UUIDv7).
message WorkspaceId {
  string value = 1;
}

// One repository's checkout config within a CreateWorkspace call. The repo
// must already exist in the registry (added via Repositories.AddRepository
// for new URL/local repos). `sparse_cones` empty = full working tree;
// non-empty = sparse cone over those repo-root-relative directories.
message WorkspaceRepoSpec {
  string repository_id = 1;
  repeated string sparse_cones = 2;
}

// Inputs for `Workspaces.CreateWorkspace`. The server assigns the id and
// derives the slug from `name` per the algorithm locked in Task 19:
// lowercase, whitespace → `-`, strip non `[a-z0-9-]`, max 64 chars, append
// `-N` on collisions.
message CreateWorkspaceRequest {
  string name = 1;
  repeated WorkspaceRepoSpec repos = 2;
  optional PermissionMode permission_mode = 3;
  optional string description = 4;
  optional string icon = 5;
}

// Inputs for `Workspaces.ListWorkspaces`.
message ListWorkspacesRequest {
  bool include_archived = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// Task 32: caller-supplied workspace settings patch.
//
// V0.1 ships a single mutable field — `permission_mode`. The wrapping
// `WorkspaceSettings` message exists so later tasks can add fields at
// higher numbers without inventing a new RPC every time. Field numbers
// here are FROZEN as of Task 32.
//
// `permission_mode` is optional: omitted means no change; to clear an
// override and fall back to the workspace default, send the field absent.
// Setting it to `PERMISSION_MODE_UNSPECIFIED` is rejected as
// `INVALID_ARGUMENT`.
message WorkspaceSettings {
  optional PermissionMode permission_mode = 1;
}

message UpdateWorkspaceSettingsRequest {
  string workspace_id = 1;
  WorkspaceSettings settings = 2;
}

// Caller-supplied workspace edit (full-form parity beyond
// UpdateWorkspaceSettings). Absent `optional` fields = leave that column
// unchanged; present (incl. empty string) = set to that value. `repos`
// empty = leave the repo set unchanged; non-empty = replace the whole set
// (a workspace can never have zero repos, so empty is an unambiguous
// "no change" sentinel). Slug is NOT editable — it is the stable handle
// minted at creation.
message UpdateWorkspaceRequest {
  string workspace_id = 1;
  optional string name = 2;
  optional string icon = 3;
  optional string description = 4;
  repeated WorkspaceRepoSpec repos = 5;
}

// One repo's attachment as read back for the edit form: its id + the
// per-(workspace, repo) sparse-cone snapshot. Empty `sparse_cones` = full
// working tree.
message WorkspaceRepoEntry {
  string repository_id = 1;
  repeated string sparse_cones = 2;
}

message ListWorkspaceReposResponse {
  // Position-ordered (declaration order).
  repeated WorkspaceRepoEntry repos = 1;
}

service Workspaces {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc GetWorkspace(WorkspaceId) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ArchiveWorkspace(WorkspaceId) returns (google.protobuf.Empty);
  // Task 31: clears `workspaces.archived_at`. Workareas remain
  // individually archived per `design/03 §3.7`; the user restores each
  // explicitly.
  rpc RestoreWorkspace(WorkspaceId) returns (Workspace);
  // Task 32: patch mutable workspace settings (V0.1: only
  // `permission_mode`). Returns the updated `Workspace` row.
  rpc UpdateWorkspaceSettings(UpdateWorkspaceSettingsRequest) returns (Workspace);
  // Edit name/icon/description and/or replace the repo set. Returns the
  // updated Workspace row.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  // Read a workspace's declared repos + per-repo cones (to pre-fill the
  // edit form).
  rpc ListWorkspaceRepos(WorkspaceId) returns (ListWorkspaceReposResponse);
}
