// Workspace entity shape + service surface.
//
// Workspaces are logical workstreams owning 1..N workareas (see design/03
// and design/09 §4.1). Task 07 locked the `Workspace` message; Task 19
// adds the `Workspaces` service (Create / Get / List / Archive) plus the
// `WorkspaceId`, `CreateWorkspaceRequest`, `ListWorkspacesRequest`, and
// `ListWorkspacesResponse` messages.
//
// V0.1 enforces single-repo workspaces in `CreateWorkspaceRequest`
// (`repository_ids.len() == 1`); the schema permits N repos via the
// `workspace_repos` junction table.
//
// Field numbers in this file are FROZEN as of Task 19.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "concerto/v1/common.proto";

message Workspace {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string slug = 4;
  optional string description = 5;
  optional PermissionMode permission_mode = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp archived_at = 8;
}

// Identifier-only request payload reused by Get/Archive. Wraps the
// workspace primary key as a TEXT (UUIDv7).
message WorkspaceId {
  string value = 1;
}

// Inputs for `Workspaces.CreateWorkspace`. The server assigns the id and
// derives the slug from `name` per the algorithm locked in Task 19:
// lowercase, whitespace → `-`, strip non `[a-z0-9-]`, max 64 chars, append
// `-N` on collisions within the project.
//
// V0.1 enforces `repository_ids.len() == 1` and returns
// `INVALID_ARGUMENT` + `ConcertoError{code="workspace.v0_single_repo_only"}`
// otherwise.
message CreateWorkspaceRequest {
  string project_id = 1;
  string name = 2;
  repeated string repository_ids = 3;
  optional PermissionMode permission_mode = 4;
  optional string description = 5;
}

// Inputs for `Workspaces.ListWorkspaces`. V0.1 scopes the listing to one
// project; pagination + archived-filter knobs land at higher field
// numbers when the UI needs them.
message ListWorkspacesRequest {
  string project_id = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// Task 32: caller-supplied workspace settings patch.
//
// V0.1 ships a single mutable field — `permission_mode`. The wrapping
// `WorkspaceSettings` message exists so later tasks can add fields at
// higher numbers without inventing a new RPC every time. Field numbers
// here are FROZEN as of Task 32.
//
// `permission_mode` is optional: omitted means "no change"; setting it
// to `PERMISSION_MODE_UNSPECIFIED` is rejected as `INVALID_ARGUMENT`
// (callers wanting "inherit from project" should omit the field, not
// send `UNSPECIFIED`).
message WorkspaceSettings {
  optional PermissionMode permission_mode = 1;
}

message UpdateWorkspaceSettingsRequest {
  string workspace_id = 1;
  WorkspaceSettings settings = 2;
}

service Workspaces {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc GetWorkspace(WorkspaceId) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ArchiveWorkspace(WorkspaceId) returns (google.protobuf.Empty);
  // Task 31: clears `workspaces.archived_at`. Workareas remain
  // individually archived per `design/03 §3.7`; the user restores each
  // explicitly.
  rpc RestoreWorkspace(WorkspaceId) returns (Workspace);
  // Task 32: patch mutable workspace settings (V0.1: only
  // `permission_mode`). Returns the updated `Workspace` row.
  rpc UpdateWorkspaceSettings(UpdateWorkspaceSettingsRequest) returns (Workspace);
}
