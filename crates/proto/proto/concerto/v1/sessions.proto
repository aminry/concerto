// Session entity shape + service surface.
//
// A session is a specific agent run on a workarea (see design/03, design/04,
// and design/09 §4.1). Task 07 locked the `Session` message; Task 23 adds the
// `Sessions` service (Create / Get / List / SendMessage / Stop) plus the
// request/response messages.
//
// `agent_kind` and `status` are strings for V0.1 simplicity; per the task
// spec, they may be promoted to enums in a later revision task.
//
// Field numbers in this file are FROZEN as of Task 07 (Session message) and
// Task 23 (Sessions service + request messages).

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "concerto/v1/common.proto";

message Session {
  string id = 1;
  string workarea_id = 2;
  string chat_id = 3;
  // agent_kind ∈ { claude | codex | gemini }
  string agent_kind = 4;
  optional string agent_version = 5;
  optional string model = 6;
  // status ∈ { starting | running | awaiting | finished | crashed }
  string status = 7;
  PermissionMode permission_mode = 8;
  google.protobuf.Timestamp started_at = 9;
  optional google.protobuf.Timestamp ended_at = 10;
}

// Identifier-only request payload reused by GetSession. Wraps the session
// primary key as a TEXT (UUIDv7).
message SessionId {
  string value = 1;
}

// Inputs for `Sessions.CreateSession`. The Agent Supervisor allocates the
// session id (UUIDv7) and the per-session UDS socket path; the caller picks
// the workarea, the agent CLI (echo | claude in V0.1), and an optional
// permission-mode override.
message CreateSessionRequest {
  string workarea_id = 1;
  // agent_kind ∈ { echo | claude } in V0.1. codex / gemini error with
  // INVALID_ARGUMENT until the Phase 3 parser packs land.
  string agent_kind = 2;
  optional string model = 3;
  optional PermissionMode permission_mode = 4;
}

message ListSessionsRequest {
  string workarea_id = 1;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// Inputs for `Sessions.SendMessage`. The payload bytes are forwarded
// verbatim to the agent's stdin (typically UTF-8 text plus a trailing
// newline; V0.1 does no parsing).
message SendMessageRequest {
  string session_id = 1;
  bytes  payload = 2;
}

// Inputs for `Sessions.StopSession`. `reason` is logged and persisted; V0.1
// does not enforce a fixed vocabulary, but `user_request | error | revert`
// are the conventional values from `design/04 §6.x`.
message StopSessionRequest {
  string session_id = 1;
  string reason = 2;
}

// Task 33: client's decision on a pending tool-approval gate.
//
// Mirrors the four legal values for a *user-initiated* resolution. The
// `auto_*` row values in `tool_approvals.decision` are written by the
// resolver itself when `PermissionResolver` returns `AutoApprove` /
// `AutoApproveOnce` / `AutoDeny`; clients never send those.
enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_APPROVE_ONCE = 2;
  APPROVAL_DECISION_DENY = 3;
}

// Task 33: inputs for `Sessions.ResolveApproval`.
//
// Sent by a client (desktop / mobile) in response to an
// `AwaitingApproval` event on `session.events.<sid>`. The server
// validates that the approval is still pending (first-write-wins),
// persists the decision on the `tool_approvals` row, and injects the
// matching accept/deny bytes into the agent's stdin via the parser
// pack's `inject_approval`.
message ResolveApprovalRequest {
  string session_id = 1;
  string approval_id = 2;
  ApprovalDecision decision = 3;
}

// Task 34: inputs for `Sessions.RevertToCheckpoint`.
//
// Sent by a client to roll a workarea's worktrees back to the state
// captured at `checkpoint_id` (one row in the `checkpoints` table).
// The server stops the workarea's live sessions, `git reset --hard`s
// each repo to the checkpoint's ref, and soft-deletes every
// `chat_message` later than the checkpoint by pointing their
// `superseded_by` at the checkpoint's `chat_message_id`. V0.1 does not
// auto-restart the session — the user clicks "Start session" again.
//
// `session_id` identifies the session whose chat thread the soft-delete
// runs against. The checkpoint row's `workarea_id` is the source of
// truth for which repos to reset.
message RevertRequest {
  string checkpoint_id = 1;
  string session_id = 2;
}

// Task 32: inputs for `Sessions.UpdateSessionPermissionMode`.
// `permission_mode` is REQUIRED and must NOT be
// `PERMISSION_MODE_UNSPECIFIED` (sessions never carry NULL — the row
// always has a concrete mode). `acknowledgement` MUST equal the literal
// `"I understand"` when `permission_mode = PERMISSION_MODE_YOLO`;
// server rejects with `FAILED_PRECONDITION` on a missing/wrong string
// and with `PERMISSION_DENIED` (`policy.locked`) when `managed.json`
// caps the chain below the requested mode.
message UpdateSessionPermissionModeRequest {
  string session_id = 1;
  PermissionMode permission_mode = 2;
  string acknowledgement = 3;
}

service Sessions {
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc GetSession(SessionId) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc SendMessage(SendMessageRequest) returns (google.protobuf.Empty);
  rpc StopSession(StopSessionRequest) returns (google.protobuf.Empty);
  // Task 32: change `sessions.permission_mode` with entry-ceremony +
  // managed.json cap enforcement. Returns the updated `Session` row.
  rpc UpdateSessionPermissionMode(UpdateSessionPermissionModeRequest) returns (Session);
  // Task 33: resolve a pending tool-approval gate raised by the
  // parser pack. First-write-wins — a second call on the same
  // `approval_id` returns `FAILED_PRECONDITION`.
  rpc ResolveApproval(ResolveApprovalRequest) returns (google.protobuf.Empty);
  // Task 34: roll the workarea's worktrees back to a per-repo
  // checkpoint. Stops the workarea's live sessions, hard-resets each
  // repo to the checkpoint ref, and soft-deletes chat messages after
  // the checkpoint. V0.1 does not auto-restart the session.
  rpc RevertToCheckpoint(RevertRequest) returns (google.protobuf.Empty);
}
