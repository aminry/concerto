// VCS (Version Control System) provider service surface — V0.1 GitHub
// via `gh` CLI shell-out (Task 45, design/13 §2 V0.1 row, §5).
//
// V0.1 scope: GitHub only, via the `gh` CLI binary on the user's PATH.
// The full octocrab REST/GraphQL client + webhook receiver + PR-set
// coordinated-merge semantics are V1.0; GitLab / Bitbucket are V2.0.
//
// Field numbers in this file are FROZEN as of Task 45.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";

// Cached PR projection — mirrors a row from the `pull_requests` table
// (migration 0008). `provider` is `"github"` for V0.1 GitHub repos.
// `state` is one of `open|closed|merged|draft` for the GitHub provider.
//
// `body` may be large but is bounded by GitHub's 65535-character PR
// body limit; the wire is not chunked.
message PullRequest {
  string id = 1;
  string workarea_id = 2;
  string repository_id = 3;
  string provider = 4;
  int64 pr_number = 5;
  string base_ref = 6;
  string head_ref = 7;
  string state = 8;
  string title = 9;
  string body = 10;
  string url = 11;
  string head_sha = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
  // Task 319 (migration 0014). Position of this PR within its workarea's
  // merge plan; default = insertion order (`max(merge_order)+1` per
  // workarea), user-reorderable via `Workareas.SetMergeOrder`. Fields 1..14
  // stay FROZEN from Task 45.
  int64 merge_order = 15;
  // The PR's GraphQL node id (octocrab needs it for review-thread / resolve
  // mutations, Task 316). Empty for rows created before octocrab was wired.
  string external_id = 16;
  // The `owner/repo` string the GraphQL endpoint keys on (Task 316). Empty
  // for pre-octocrab rows.
  string repository_full_name = 17;
}

// A single GitHub check run for `head_sha`. Mirrors `gh pr view --json
// statusCheckRollup` entries one-to-one (plus the surrounding
// repository field). V0.1 reports the GitHub-side `status` /
// `conclusion` strings verbatim; the UI maps them onto a colour band.
message CheckRun {
  string name = 1;
  // status ∈ { queued | in_progress | completed }
  string status = 2;
  // conclusion (only set when status == completed) ∈
  // { success | failure | neutral | cancelled | timed_out | action_required | stale | skipped }
  string conclusion = 3;
  string details_url = 4;
}

// Inputs for `Vcs.GetPullRequest`. The server reads the live PR JSON
// via `gh pr view --json <fields>` on `(repository_id, pr_number)`,
// upserts the cached `pull_requests` row, and returns it.
message GetPrRequest {
  string repository_id = 1;
  int64 pr_number = 2;
}

// Inputs for `Vcs.CreatePullRequest`. The server resolves
// `repository_id` to the local clone's full name (`owner/repo`) via
// the persisted `repositories` row, shells out to `gh pr create
// --json` with the given base/head/title/body, persists the result
// to `pull_requests`, and returns it.
//
// `head` is the branch name (already pushed by the agent); the server
// does NOT push on the caller's behalf in V0.1. `base` defaults to the
// repository's `default_branch` when empty.
message CreatePrRequest {
  string workarea_id = 1;
  string repository_id = 2;
  string base = 3;
  string head = 4;
  string title = 5;
  string body = 6;
}

// Inputs for `Vcs.MergePullRequest`. `method` MUST be one of
// `merge|squash|rebase` (lowercase). The server invokes
// `gh pr merge --<method>` and refreshes the cached row.
message MergePrRequest {
  string repository_id = 1;
  int64 pr_number = 2;
  // One of merge | squash | rebase. Empty defaults to `merge`.
  string method = 3;
}

// Inputs for `Vcs.GetChecks`. Returns the list of check runs for the
// given commit SHA on the given repository. The server shells out to
// `gh api /repos/<owner>/<repo>/commits/<sha>/check-runs --jq` for the
// flat list shape.
message GetChecksRequest {
  string repository_id = 1;
  string sha = 2;
}

message GetChecksResponse {
  repeated CheckRun checks = 1;
}

// Inputs for `Vcs.FetchIssue`. V0.1 supports GitHub issues on the same
// host as the repository (single-host inference); cross-host fetch is
// V1.0. `issue_number` is the GitHub `#<n>` integer.
message FetchIssueRequest {
  string repository_id = 1;
  int64 issue_number = 2;
}

// Issue projection consumed by the workspace-creation-from-issue flow.
// Body is capped to GitHub's 65k limit; labels are returned verbatim as
// lowercase strings.
//
// `number` is the **GitHub-only** integer id (`#<n>`); it is `0` for
// Linear/Jira issues, which have a provider-native **string** id carried
// in `external_id` (`ENG-123` / `PROJ-45`). Field numbers FROZEN; Task 317
// appends `external_id = 7` (additive — never reuse 1..6).
message Issue {
  int64 number = 1;
  string title = 2;
  string body = 3;
  string state = 4;
  string url = 5;
  repeated string labels = 6;
  // The provider-native string id for Linear (`ENG-123`) / Jira (`PROJ-45`).
  // Empty for GitHub issues (which use `number`). Added by Task 317.
  string external_id = 7;
}

// Inputs for `Vcs.FetchIssueByUrl` (Task 317). Routes by URL host:
// `github.com`/Enterprise → GitHub; `linear.app` → the Linear GraphQL
// client; `*.atlassian.net` → the Jira REST client. Lets the Desktop /
// Maestro resolve any tracker issue URL into the shared `Issue` shape
// without first mapping it to a local `repository_id`.
message FetchIssueByUrlRequest {
  // A full issue URL (e.g. `https://linear.app/acme/issue/ENG-123/...`,
  // `https://acme.atlassian.net/browse/PROJ-45`, or a github.com issue URL).
  string url = 1;
}

// The VCS provider an OAuth token / API key is being stored for
// (`Vcs.SetVcsCredential`, Task 317). Field numbers FROZEN.
enum VcsCredentialProvider {
  VCS_CREDENTIAL_PROVIDER_UNSPECIFIED = 0;
  VCS_CREDENTIAL_PROVIDER_LINEAR = 1;
  VCS_CREDENTIAL_PROVIDER_JIRA = 2;
}

// Inputs for `Vcs.SetVcsCredential` (Task 317, locked decision D6).
//
// **Desktop-mediated OAuth.** There is no loopback/redirect server on the
// Core: the Desktop runs the Linear/Atlassian 3LO dance in its own webview
// and calls this RPC with the resulting access (+ optional refresh) token;
// the Core stores the secret in the OS keychain (via the FROZEN
// `VcsSecretSlot` accessor) and the non-secret metadata in `vcs_credentials`.
// The Core never sees the browser. Linear's **personal API key** takes the
// same path with `refresh_token` / `expires_at` empty.
//
// The token is the ONLY cleartext-secret field on the VCS wire surface; the
// handler writes it straight to the keychain and never logs or persists it
// to SQLite.
message SetVcsCredentialRequest {
  VcsCredentialProvider provider = 1;
  // The provider account id (the keychain `scope_id` for the Linear/Jira
  // token slots) — e.g. the Linear workspace / Jira cloud account id.
  string account_id = 2;
  // The OAuth access token, or (Linear) a personal API key. Cleartext on the
  // wire; stored only in the keychain.
  string access_token = 3;
  // The OAuth refresh token, when the flow returned one (absent for a Linear
  // personal API key).
  optional string refresh_token = 4;
  // Access-token expiry, epoch ms (absent for a non-expiring personal key).
  optional int64 expires_at = 5;
}

// A single review-thread comment (Task 316, design/13 §3.6). `body` is the
// comment text; `author` is the GitHub login. Field numbers FROZEN.
message ReviewThreadComment {
  string author = 1;
  string body = 2;
}

// A review thread on a PR (Task 316, design/13 §3.6/§3.8). GraphQL-sourced,
// never persisted to SQLite (GitHub is canonical). `id` is the GraphQL node
// id (the `ResolveThread` mutation key). Field numbers FROZEN.
message ReviewThread {
  // The GraphQL thread node id.
  string id = 1;
  // Whether the thread is resolved.
  bool resolved = 2;
  // The file path the thread is anchored to; empty for PR-level threads.
  string path = 3;
  // The thread's comments, oldest first.
  repeated ReviewThreadComment comments = 4;
}

// A deployment + its latest aggregated status (Task 316, design/13 §3.8). The
// `state` is the most-recent deployment-status (`success|failure|in_progress|
// queued|...`), empty when the deployment has no status yet. Field numbers
// FROZEN.
message Deployment {
  string id = 1;
  string environment = 2;
  string state = 3;
  // The git ref / SHA this deployment targets.
  string ref = 4;
}

// Inputs for `Vcs.ListReviewThreads` (Task 316). Resolves the PR by
// `(repository_id, pr_number)`; the server fetches the threads via GitHub's
// GraphQL API, caches them in memory keyed by PR (refresh-on-open), and emits
// `pr.thread_updated` on `checks.<workarea_id>.<repository_id>` when they
// change. `workarea_id` scopes the emitted subject (the threads cache is per
// PR; the event is per (workarea, repo)).
message ListReviewThreadsRequest {
  string workarea_id = 1;
  string repository_id = 2;
  int64 pr_number = 3;
}

message ListReviewThreadsResponse {
  repeated ReviewThread threads = 1;
}

// Inputs for `Vcs.ResolveThread` (Task 316). `thread_id` is the GraphQL thread
// node id from `ListReviewThreads`. On success the server runs the
// `resolveReviewThread` GraphQL mutation, updates the cached thread's resolved
// flag, and emits `pr.thread_updated`. `workarea_id`/`repository_id` scope the
// emitted `checks.<wa>.<repo>` subject.
message ResolveThreadRequest {
  string workarea_id = 1;
  string repository_id = 2;
  string thread_id = 3;
}

// Inputs for `Vcs.ListDeployments` (Task 316). Lists the repository's
// deployments for `ref` and aggregates each one's latest status, caching the
// result and emitting `pr.deployment_updated` on change.
message ListDeploymentsRequest {
  string workarea_id = 1;
  string repository_id = 2;
  // The git ref / SHA to list deployments for.
  string ref = 3;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}

// Inputs for `Vcs.SendThreadToAgent` (Task 316, design/13 §3.6 "Send to
// agent"). Composes a message with the review-thread context attached and
// posts it to a user-picked session of the workarea (the Core-side
// compose+route; the UI picker is Task 324). `session_id` is the target
// session within the workarea.
message SendThreadToAgentRequest {
  string workarea_id = 1;
  string repository_id = 2;
  // The PR the thread belongs to (locates/refreshes the thread cache).
  int64 pr_number = 3;
  // The GraphQL thread node id whose context is attached.
  string thread_id = 4;
  // The target session within the workarea (the user-picked session).
  string session_id = 5;
}

// V0.1 VCS service surface, frozen at Task 45. The five RPCs cover the
// GitHub operations the Workarea + Maestro subsystems need for the
// V0.1 demo path: create a PR, look it up, merge it, see its checks,
// fetch a referenced issue. Everything else — review threads,
// deployments, PR-set coordinated merge, webhooks, GitLab / Bitbucket
// — lives in V1.0 / V2.0 per `design/13 §2`.
service Vcs {
  rpc GetPullRequest(GetPrRequest) returns (PullRequest);
  rpc CreatePullRequest(CreatePrRequest) returns (PullRequest);
  rpc MergePullRequest(MergePrRequest) returns (google.protobuf.Empty);
  rpc GetChecks(GetChecksRequest) returns (GetChecksResponse);
  rpc FetchIssue(FetchIssueRequest) returns (Issue);
  // Resolve a full issue URL (GitHub / Linear / Jira) into the shared
  // `Issue`, routing by host. Additive to the FROZEN `FetchIssue` above
  // (Task 317).
  rpc FetchIssueByUrl(FetchIssueByUrlRequest) returns (Issue);
  // Store a Linear/Jira OAuth token (or Linear personal API key) the Desktop
  // obtained via its webview (Desktop-mediated OAuth, D6) → OS keychain
  // (Task 317).
  rpc SetVcsCredential(SetVcsCredentialRequest) returns (google.protobuf.Empty);
  // List a PR's review threads via GitHub GraphQL (Task 316, design/13 §3.6).
  // Cached in memory (never SQLite); emits `pr.thread_updated` on change.
  // Additive above the FROZEN Task-45 five + Task-317's two.
  rpc ListReviewThreads(ListReviewThreadsRequest) returns (ListReviewThreadsResponse);
  // Mark a review thread resolved via the `resolveReviewThread` GraphQL
  // mutation (Task 316); updates the cache + emits `pr.thread_updated`.
  rpc ResolveThread(ResolveThreadRequest) returns (google.protobuf.Empty);
  // List a repository's deployments for a ref + aggregate their statuses
  // (Task 316); emits `pr.deployment_updated` on change.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // Compose a message with a review thread's context attached + post it to a
  // user-picked session of the workarea (Task 316, design/13 §3.6 "Send to
  // agent"; the UI picker is Task 324).
  rpc SendThreadToAgent(SendThreadToAgentRequest) returns (google.protobuf.Empty);
}
