// Projects service — minimal read surface (Task 24).
//
// V0.1 does not expose project creation over gRPC; projects are seeded
// via direct SQL (see `crates/persist/src/projects.rs`). Task 24 adds
// `ListProjects` so the Desktop sidebar can populate its top-level
// node without hardcoding a project id. Create/Update/Archive arrive
// in a later phase.
//
// Field numbers in this file are FROZEN as of Task 24.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/timestamp.proto";

message Project {
  string id = 1;
  string name = 2;
  optional string icon = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp archived_at = 5;
}

// Inputs for `Projects.ListProjects`. V0.1 has no filtering knobs; the
// caller receives every project ordered by `name`.
message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

service Projects {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
}
