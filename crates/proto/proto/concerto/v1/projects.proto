// Projects service — minimal read surface (Task 24) + create (post-V0.1).
//
// `ListProjects` lets the Desktop sidebar populate its top-level node
// without hardcoding a project id. `CreateProject` was deferred in V0.1
// (projects had to be seeded via direct SQL) but the Sidebar surfaces it
// as a "+ Project" affordance once the table is empty, so the RPC is now
// part of the wire surface. Update/Archive still arrive in a later phase.
//
// Field numbers in this file are FROZEN as of Task 24.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/timestamp.proto";

message Project {
  string id = 1;
  string name = 2;
  optional string icon = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp archived_at = 5;
}

// Inputs for `Projects.ListProjects`. V0.1 has no filtering knobs; the
// caller receives every project ordered by `name`.
message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

// Inputs for `Projects.CreateProject`. Server assigns `id` (UUIDv7) and
// `created_at` (server clock) — the caller only provides display fields.
message CreateProjectRequest {
  string name = 1;
  optional string icon = 2;
}

service Projects {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (Project);
}
