// Repositories service — V0.1 surface for adding a repository to a project,
// cloning it onto disk, and listing per-project memberships.
//
// Owned in design by `02_Repository_Manager.md`. V0.1 ships full clone only:
// no sparse, no blobless, no treeless. Future tasks extend with sparse cones
// (`Repositories.SetCones`), prewarm (`PrewarmBlobs`), fetch (`Fetch`), and
// estimate (`EstimateConeSize`) — all locked at higher field numbers so they
// land additively.
//
// Field numbers in this file are FROZEN as of Task 18; Task 25 adds the
// read-side `ListByProject` RPC + accompanying request / response messages
// without re-numbering the existing fields.
//
// Task 301 (V1.0, design/02 §3.5/§7.1) appends the pre-clone
// `EstimateRepoSize(EstimateRepoSizeRequest) → SizeReport` probe RPC after
// `ListByProject` and adds `clone_strategy = 5` + `with_sparse = 6` to
// `AddRepoRequest`. All existing RPCs + field numbers are unchanged.
//
// Task 302 (V1.0, design/02 §3.2/§5.1) appends the per-(workarea, repo)
// `SetCones(SetConesRequest) → SetConesResponse` RPC after `EstimateRepoSize`
// (cone-mode + sparse-index always). All existing RPCs + field numbers are
// unchanged.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/timestamp.proto";

// Persistent shape of a repository row. Mirrors the V0.1 columns of the
// `repositories` table (see `crates/persist/migrations/0001_initial_schema.sql`).
// `clone_strategy` is always `"full"` in V0.1; the column accepts
// `full | blobless | treeless` in anticipation of V1.0.
message Repository {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string url = 4;
  string local_path = 5;
  string clone_strategy = 6;
  string default_branch = 7;
  optional google.protobuf.Timestamp last_fetch_at = 8;
}

// Inputs for `Repositories.AddRepository`. The Repo Manager picks the
// `repository_id` (UUIDv7) and the on-disk `local_path`
// (`<data_dir>/repos/<id>/`). The caller supplies project membership, a
// short name used in path segments, and the URL.
message AddRepoRequest {
  string project_id = 1;
  string name = 2;
  string url = 3;
  // Optional explicit default branch. V0.1 accepts `"main"` as a fallback
  // when empty; later tasks may probe the remote.
  string default_branch = 4;
  // Clone strategy (Task 301, design/02 §3.1). One of the lowercase
  // `repositories.clone_strategy` TEXT values: `full | blobless | treeless`.
  // Empty string parses as `full` (preserves V0.1 callers). An unrecognized
  // value is rejected with INVALID_ARGUMENT.
  string clone_strategy = 5;
  // When true, append `--sparse --no-checkout` to the clone so the worktree
  // lands empty for Task 302's `sparse-checkout init --cone` to populate.
  // The size→strategy recommendation's "Blobless + Sparse" is
  // `clone_strategy = "blobless"` + `with_sparse = true`.
  bool with_sparse = 6;
}

// Inputs for `Repositories.Clone`. The repository must already exist (via
// `AddRepository`); cloning is a separate step so the UI can show the row
// before the disk operation completes.
message CloneRequest {
  string repository_id = 1;
}

// Streaming progress message emitted from the clone shell-out's stderr
// parser. Field semantics match git's own progress text:
//   - `phase` — short label, e.g. `"receiving objects"`, `"resolving deltas"`.
//   - `objects_received` / `total_objects` — counts parsed from
//     `Receiving objects:  N% (R/T)`.
//   - `bytes_received` — best-effort byte count parsed from the same line
//     when git emits a KiB/MiB suffix. Zero if unparsed.
//   - `done` — true on the terminal message after the clone exits cleanly.
message CloneProgress {
  string phase = 1;
  uint64 objects_received = 2;
  uint64 total_objects = 3;
  uint64 bytes_received = 4;
  bool done = 5;
}

// Inputs for `Repositories.ListByProject` (Task 25). The Desktop "Add
// Repository" form uses this to render the list of repos already attached
// to the active project so the New Workspace modal's repo picker has data.
message ListRepositoriesRequest {
  string project_id = 1;
}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

// Inputs for `Repositories.EstimateRepoSize` (Task 301). The repo-level
// pre-clone probe: a caller passes a git URL *before* `AddRepository` and
// gets back a `SizeReport` carrying the design/02 §3.5 strategy
// recommendation. Distinct from Task 305's cone-level `EstimateConeSize`
// (which probes the git index of an already-cloned repo).
message EstimateRepoSizeRequest {
  string url = 1;
}

// Result of `Repositories.EstimateRepoSize` (Task 301). The estimator runs
// `git ls-remote --heads` (branch + ref count) plus a cheap blobless object
// probe, then applies the design/02 §3.5 heuristic
// (`< 1 GB → full`, `1–10 GB → blobless`, `> 10 GB → blobless + sparse`).
// `recommended_strategy` is one of `full | blobless` — treeless is NEVER
// recommended (design/02 §12 R-1). `recommend_sparse` is the cone-picker
// hint for the > 10 GB tier. A failed probe surfaces as a gRPC error; the
// caller falls back to a manual strategy pick (no default recommendation).
message SizeReport {
  uint64 size_bytes = 1;
  uint64 object_count = 2;
  uint32 branch_count = 3;
  string recommended_strategy = 4;
  bool recommend_sparse = 5;
}

// Inputs for `Repositories.SetCones` (Task 302, design/02 §3.2/§5.1).
// Sets the per-(workarea, repo) sparse cone: the Repo Manager applies the
// cone to the on-disk worktree (cone-mode + `--sparse-index` always) and
// persists it to `workarea_repos.sparse_cones_json`. `cone_paths` are
// forward-slash, repo-root-relative directory paths; an empty list cones
// the repo down to just its top-level files. A path absent from the repo's
// HEAD tree is rejected with INVALID_ARGUMENT and nothing is half-applied
// (design/02 §8).
message SetConesRequest {
  string workarea_id = 1;
  string repository_id = 2;
  repeated string cone_paths = 3;
}

// Result of `Repositories.SetCones` (Task 302). Echoes back the cone paths
// that are now active for the (workarea, repo) — the same set the worktree
// was materialized to and that was persisted to `sparse_cones_json`.
message SetConesResponse {
  repeated string cone_paths = 1;
}

service Repositories {
  rpc AddRepository(AddRepoRequest) returns (Repository);
  rpc Clone(CloneRequest) returns (stream CloneProgress);
  rpc ListByProject(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc EstimateRepoSize(EstimateRepoSizeRequest) returns (SizeReport);
  rpc SetCones(SetConesRequest) returns (SetConesResponse);
}
