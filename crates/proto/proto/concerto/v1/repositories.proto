// Repositories service — V0.1 surface for adding a repository to a project,
// cloning it onto disk, and listing per-project memberships.
//
// Owned in design by `02_Repository_Manager.md`. V0.1 ships full clone only:
// no sparse, no blobless, no treeless. Future tasks extend with sparse cones
// (`Repositories.SetCones`), prewarm (`PrewarmBlobs`), fetch (`Fetch`), and
// estimate (`EstimateConeSize`) — all locked at higher field numbers so they
// land additively.
//
// Field numbers in this file are FROZEN as of Task 18; Task 25 adds the
// read-side `ListByProject` RPC + accompanying request / response messages
// without re-numbering the existing fields.
//
// Task 301 (V1.0, design/02 §3.5/§7.1) appends the pre-clone
// `EstimateRepoSize(EstimateRepoSizeRequest) → SizeReport` probe RPC after
// `ListByProject` and adds `clone_strategy = 5` + `with_sparse = 6` to
// `AddRepoRequest`. All existing RPCs + field numbers are unchanged.
//
// Task 302 (V1.0, design/02 §3.2/§5.1) appends the per-(workarea, repo)
// `SetCones(SetConesRequest) → SetConesResponse` RPC after `EstimateRepoSize`
// (cone-mode + sparse-index always). All existing RPCs + field numbers are
// unchanged.
//
// Task 304 (V1.0, design/02 §3.3/§5.2) appends the idle blob prewarm RPC
// `PrewarmBlobs(PrewarmRequest) → stream PrewarmProgress` after `SetCones`.
// `PrewarmProgress` is FROZEN by PHASE3_PLANNING §4.6. All existing RPCs +
// field numbers are unchanged. (Task 305 owns the sibling
// `EstimateConeSize`/`ConeStats` shapes; the two tasks do not collide.)
//
// Task 305 (V1.0, design/02 §3.2/§5.1/§5.2) appends the cone-level telemetry
// probe `EstimateConeSize(EstimateConeSizeRequest) → ConeStats` (unary) after
// `PrewarmBlobs`. `ConeStats` + `EstimateConeSizeRequest` are FROZEN by
// PHASE3_PLANNING §4.6. This is the post-clone, per-cone, git-index-read probe
// — distinct from Task 301's pre-clone `EstimateRepoSize` and Task 304's blob
// prewarm. All existing RPCs + field numbers are unchanged.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/timestamp.proto";

// Persistent shape of a repository row. Mirrors the V0.1 columns of the
// `repositories` table (see `crates/persist/migrations/0001_initial_schema.sql`).
// `clone_strategy` is always `"full"` in V0.1; the column accepts
// `full | blobless | treeless` in anticipation of V1.0.
message Repository {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string url = 4;
  string local_path = 5;
  string clone_strategy = 6;
  string default_branch = 7;
  optional google.protobuf.Timestamp last_fetch_at = 8;
  // The repository's default sparse cone (design/02 §3.2). A flat list of
  // forward-slash, repo-root-relative directory paths persisted to
  // `repositories.cone_defaults_json`; inherited by every new workarea via
  // the three-layer cone resolver (least-specific layer). Decoded from the
  // row's `cone_defaults_json` everywhere a `Repository` is built.
  repeated string cone_defaults = 9;
}

// Inputs for `Repositories.AddRepository`. The Repo Manager picks the
// `repository_id` (UUIDv7) and the on-disk `local_path`
// (`<data_dir>/repos/<id>/`). The caller supplies project membership, a
// short name used in path segments, and the URL.
message AddRepoRequest {
  string project_id = 1;
  string name = 2;
  string url = 3;
  // Optional explicit default branch. V0.1 accepts `"main"` as a fallback
  // when empty; later tasks may probe the remote.
  string default_branch = 4;
  // Clone strategy (Task 301, design/02 §3.1). One of the lowercase
  // `repositories.clone_strategy` TEXT values: `full | blobless | treeless`.
  // Empty string parses as `full` (preserves V0.1 callers). An unrecognized
  // value is rejected with INVALID_ARGUMENT.
  string clone_strategy = 5;
  // When true, append `--sparse --no-checkout` to the clone so the worktree
  // lands empty for Task 302's `sparse-checkout init --cone` to populate.
  // The size→strategy recommendation's "Blobless + Sparse" is
  // `clone_strategy = "blobless"` + `with_sparse = true`.
  bool with_sparse = 6;
}

// Inputs for `Repositories.Clone`. The repository must already exist (via
// `AddRepository`); cloning is a separate step so the UI can show the row
// before the disk operation completes.
message CloneRequest {
  string repository_id = 1;
}

// Streaming progress message emitted from the clone shell-out's stderr
// parser. Field semantics match git's own progress text:
//   - `phase` — short label, e.g. `"receiving objects"`, `"resolving deltas"`.
//   - `objects_received` / `total_objects` — counts parsed from
//     `Receiving objects:  N% (R/T)`.
//   - `bytes_received` — best-effort byte count parsed from the same line
//     when git emits a KiB/MiB suffix. Zero if unparsed.
//   - `done` — true on the terminal message after the clone exits cleanly.
message CloneProgress {
  string phase = 1;
  uint64 objects_received = 2;
  uint64 total_objects = 3;
  uint64 bytes_received = 4;
  bool done = 5;
}

// Inputs for `Repositories.ListByProject` (Task 25). The Desktop "Add
// Repository" form uses this to render the list of repos already attached
// to the active project so the New Workspace modal's repo picker has data.
message ListRepositoriesRequest {
  string project_id = 1;
}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

// Inputs for `Repositories.EstimateRepoSize` (Task 301). The repo-level
// pre-clone probe: a caller passes a git URL *before* `AddRepository` and
// gets back a `SizeReport` carrying the design/02 §3.5 strategy
// recommendation. Distinct from Task 305's cone-level `EstimateConeSize`
// (which probes the git index of an already-cloned repo).
message EstimateRepoSizeRequest {
  string url = 1;
}

// Result of `Repositories.EstimateRepoSize` (Task 301). The estimator runs
// `git ls-remote --heads` (branch + ref count) plus a cheap blobless object
// probe, then applies the design/02 §3.5 heuristic
// (`< 1 GB → full`, `1–10 GB → blobless`, `> 10 GB → blobless + sparse`).
// `recommended_strategy` is one of `full | blobless` — treeless is NEVER
// recommended (design/02 §12 R-1). `recommend_sparse` is the cone-picker
// hint for the > 10 GB tier. A failed probe surfaces as a gRPC error; the
// caller falls back to a manual strategy pick (no default recommendation).
message SizeReport {
  uint64 size_bytes = 1;
  uint64 object_count = 2;
  uint32 branch_count = 3;
  string recommended_strategy = 4;
  bool recommend_sparse = 5;
}

// Inputs for `Repositories.SetCones` (Task 302, design/02 §3.2/§5.1).
// Sets the per-(workarea, repo) sparse cone: the Repo Manager applies the
// cone to the on-disk worktree (cone-mode + `--sparse-index` always) and
// persists it to `workarea_repos.sparse_cones_json`. `cone_paths` are
// forward-slash, repo-root-relative directory paths; an empty list cones
// the repo down to just its top-level files. A path absent from the repo's
// HEAD tree is rejected with INVALID_ARGUMENT and nothing is half-applied
// (design/02 §8).
message SetConesRequest {
  string workarea_id = 1;
  string repository_id = 2;
  repeated string cone_paths = 3;
}

// Result of `Repositories.SetCones` (Task 302). Echoes back the cone paths
// that are now active for the (workarea, repo) — the same set the worktree
// was materialized to and that was persisted to `sparse_cones_json`.
message SetConesResponse {
  repeated string cone_paths = 1;
}

// Inputs for `Repositories.PrewarmBlobs` (Task 304, design/02 §3.3/§5.2).
// Materializes the lazy blobs of a blobless clone (Task 301) that are
// reachable in `cone_paths` at `commit`, ahead of agent need. `cone_paths`
// are forward-slash, repo-root-relative directory paths; an empty list
// prewarms the whole tree at `commit`. The Repo Manager serializes the
// prewarm fetch behind the existing per-repo write lock and the global
// 2-concurrent prewarm semaphore.
message PrewarmRequest {
  string repository_id = 1;
  repeated string cone_paths = 2;
  string commit = 3;
}

// Streaming progress for `Repositories.PrewarmBlobs` (Task 304). FROZEN by
// PHASE3_PLANNING §4.6:
//   - `blobs_fetched` — cumulative in-cone blobs materialized so far.
//   - `blobs_total` — total in-cone blob OIDs discovered at `commit`.
//   - `done` — true on the terminal message (clean finish OR cancellation).
message PrewarmProgress {
  uint64 blobs_fetched = 1;
  uint64 blobs_total = 2;
  bool done = 3;
}

// Inputs for `Repositories.EstimateConeSize` (Task 305, design/02 §3.2/§5.1).
// The cone-level, post-clone telemetry probe: given an already-added
// repository and a set of `cone_paths`, the Repo Mgr reads the git index and
// returns the file count + disk-size estimate the cone would materialize.
// `cone_paths` are forward-slash, repo-root-relative directory prefixes. An
// empty list falls back to the repository's `cone_defaults_json`, and when
// that is also empty counts every tracked file in the index. Distinct from
// Task 301's pre-clone `EstimateRepoSize` (which probes a remote URL).
// FROZEN by PHASE3_PLANNING §4.6.
message EstimateConeSizeRequest {
  string repository_id = 1;
  repeated string cone_paths = 2;
}

// Result of `Repositories.EstimateConeSize` (Task 305) — and the cone-picker
// telemetry the Desktop (Task 322) renders. FROZEN by PHASE3_PLANNING §4.6:
//   - `file_count` — tracked file entries the cone would materialize, read
//     from the git index (NOT a filesystem walk; design/02 §3.2).
//   - `disk_size_bytes` — sum of those entries' recorded sizes from the
//     index. This is an order-of-magnitude estimate: a blobless clone's
//     not-yet-fetched blobs carry a 0 recorded size, so the number is a
//     lower bound until the blobs are materialized (design/02 §3.2 wants an
//     order-of-magnitude for the picker). The estimate basis is FROZEN.
message ConeStats {
  uint64 file_count = 1;
  uint64 disk_size_bytes = 2;
}

// Inputs for `Repositories.ListTree` (design/02 §3.2). The browsable
// repo-tree probe: lists the IMMEDIATE (non-recursive) children of `path`
// at `git_ref`, so the desktop "Choose directories for the sparse
// checkout" picker can lazily expand the repo's directory tree without
// fetching the whole tree. `path` is repo-root-relative (`""` = root);
// `git_ref` empty ⇒ the repository's default branch / HEAD.
message ListTreeRequest {
  string repository_id = 1;
  string path = 2;
  string git_ref = 3;
}

// One entry in a `ListTree` listing. `name` is the basename; `path` is the
// full repo-root-relative path (the cone-path the picker checks);
// `is_dir` distinguishes a directory (a checkable cone unit) from a file
// (shown for context, not checkable — cone mode selects directories).
// A submodule (`commit` objecttype) is reported as a leaf (`is_dir=false`).
message TreeEntry {
  string name = 1;
  bool is_dir = 2;
  string path = 3;
}

message ListTreeResponse { repeated TreeEntry entries = 1; }

// Inputs for `Repositories.SetRepoConeDefaults` (design/02 §3.2). Sets the
// repository's default sparse cone (`repositories.cone_defaults_json`) AND
// propagates it to every existing workarea of the repo (re-applying the
// cone to each workarea worktree). `cone_paths` are forward-slash,
// repo-root-relative directory paths; `[]` clears the default. An invalid
// path (absent from the repo index) is rejected with INVALID_ARGUMENT
// before anything is persisted.
message SetRepoConeDefaultsRequest {
  string repository_id = 1;
  repeated string cone_paths = 2;
}

// Result of `Repositories.SetRepoConeDefaults`. Echoes the applied cone
// set and reports how many existing workareas were successfully
// re-applied (propagation is best-effort per workarea — a workarea with
// conflicting local changes is skipped with a warning and not counted).
message SetRepoConeDefaultsResponse {
  repeated string cone_paths = 1;
  uint32 workareas_updated = 2;
}

service Repositories {
  rpc AddRepository(AddRepoRequest) returns (Repository);
  rpc Clone(CloneRequest) returns (stream CloneProgress);
  rpc ListByProject(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc EstimateRepoSize(EstimateRepoSizeRequest) returns (SizeReport);
  rpc SetCones(SetConesRequest) returns (SetConesResponse);
  rpc PrewarmBlobs(PrewarmRequest) returns (stream PrewarmProgress);
  rpc EstimateConeSize(EstimateConeSizeRequest) returns (ConeStats);
  rpc ListTree(ListTreeRequest) returns (ListTreeResponse);
  rpc SetRepoConeDefaults(SetRepoConeDefaultsRequest) returns (SetRepoConeDefaultsResponse);
}
