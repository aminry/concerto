// Device pairing + management service (design/12 §3.3, §5.2).
//
// Task 207 creates this file with the two **pairing** RPCs only:
//   - StartPairing   — mint a one-shot pairing token + return the QR payload.
//   - CompletePairing — run the Noise XX handshake bootstrapped by that token,
//                       verify the device's signature, issue a DeviceCert.
//
// Task 209 LATER EXTENDS this same `Devices` service with `ListDevices`,
// `RevokeDevice`, and `GetCoreInfo` (the device list/revoke side + the
// `devices`-table read/revoke columns). A device push-token RPC is deferred to
// Phase 5 (notifications). Those additions append NEW field/RPC numbers; the
// numbers assigned in THIS file are FROZEN and must never be reordered or
// repurposed.
//
// Field numbers in this file are FROZEN as of Task 207.

syntax = "proto3";

package concerto.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The QR-payload challenge returned by `Devices.StartPairing` (design/12 §3.3,
// named `PairingChallenge` per §5.2). The operator/UI base64-encodes these
// fields into the QR code the new device scans. The `pairing_token` is the raw
// 32-byte one-shot secret (NOT its at-rest hash); the device uses it both as
// the Noise XX pre-shared key and as the leading bytes of its signed payload.
//
// The token is in-memory only on the Core, expires 60 s after issuance, is
// one-shot (consumed by the first successful `CompletePairing`), and at most 3
// are active at once (older ones rotate out) — see design/12 §6.2.
message PairingChallenge {
  // The Core's Ed25519 identity public key (32 bytes). The device persists
  // this as `core_pubkey` so subsequent connects can validate the Core's
  // signature on its DeviceCert.
  bytes core_pubkey = 1;
  // The raw 32-byte one-shot pairing token. Secret; carried in the QR only.
  bytes pairing_token = 2;
  // The Core's LAN endpoint (mDNS-resolved address), when discovered, so the
  // pairing never touches the relay. Empty when no LAN endpoint is known. The
  // real endpoint string is supplied by Task 212/213; Task 207 emits whatever
  // the coordinator is configured with (empty in the loopback double).
  string lan_endpoint = 3;
  // A relay hint for off-LAN pairing fallback (design/12 §3.3 / §12 R-3).
  // Empty when no relay is configured. Same protocol either way.
  string relay_hint = 4;
  // When the token expires (issued_at + 60 s). The device should complete
  // pairing before this instant; a photographed-but-unused token still expires.
  google.protobuf.Timestamp expires_at = 5;
}

// Inputs for `Devices.CompletePairing`. Carries the device's
// `PairingRequest` material (design/12 §3.3). Task 207 transports this over the
// Noise XX channel in production; the loopback double passes the same bytes
// in-process.
//
// The signature proves possession of BOTH the device private key AND the
// pairing token: it is the device's Ed25519 signature over the exact byte
// concatenation `pairing_token (32 bytes) || nonce (32 bytes) ||
// device_pubkey (32 bytes)`, in that order (FROZEN — both signer and verifier
// depend on this layout and on the 32-byte nonce length so the verifier can
// parse the concatenation unambiguously). The Core re-derives the leading
// `pairing_token` from its own stored token (matched by hash), reads
// `nonce`/`device_pubkey`/`signature` from this message, reconstructs the
// payload, and verifies the signature against `device_pubkey`.
message CompletePairingRequest {
  // The pairing device's Ed25519 public key (32 bytes). Becomes the cert's
  // `device_pubkey`; `device_id = BLAKE2b-256(device_pubkey)`.
  bytes device_pubkey = 1;
  // The user-supplied device name captured at pairing time.
  string device_name = 2;
  // A 32-byte random nonce the device chose, included verbatim in the signed
  // payload to bind this request (replay-distinct). FROZEN length: 32 bytes.
  bytes nonce = 3;
  // The device's Ed25519 signature (64 bytes) over
  // `pairing_token || nonce || device_pubkey`.
  bytes signature = 4;
  // The raw 32-byte pairing token the device read from the QR. The Core hashes
  // it (BLAKE2b-256) to look up + consume the matching in-memory token state,
  // and uses the raw bytes as the leading segment of the signed payload it
  // re-derives. (In production this rides inside the Noise channel whose PSK is
  // the same token; carrying it here keeps the handler transport-agnostic for
  // the Tier-2 loopback double.)
  bytes pairing_token = 5;
}

// Response for `Devices.CompletePairing`. Carries the freshly-minted device
// certificate plus the Core's public key.
//
// DECISION D1 (design/12 §5.2): the cert rides as **opaque CBOR `bytes`**, NOT
// a protobuf-typed message. `signed_device_cert` is the on-wire cert form
// `cert_bytes || signature` (the canonical-CBOR `DeviceCert` body followed by
// the Core's 64-byte Ed25519 signature) exactly as `concerto-identity`'s
// `verify_cert` / `validate` expect it. The device stores these bytes verbatim
// and presents them on every subsequent connect; the proto layer never decodes
// the CBOR.
message CompletePairingResponse {
  // The signed device certificate as opaque CBOR bytes (`cert_bytes ||
  // signature`). NOT a protobuf message — see Decision D1 above.
  bytes signed_device_cert = 1;
  // The Core's Ed25519 identity public key (32 bytes), echoed so the device
  // can persist `{device_priv, device_cert, core_pubkey}` (design/12 §3.3).
  bytes core_pubkey = 2;
}

// One row of the paired-device list (design/12 §5.2), returned by
// `Devices.ListDevices`. Mirrors the `devices` table (09 §4.4); Task 209 reads
// active + revoked rows alike so an admin client can show revoked devices.
//
// SENTINEL CONVENTION (FROZEN): the nullable `last_seen_at` / `revoked_at`
// SQLite INTEGER columns map to `0` here when NULL. `revoked_at == 0` means the
// device is **active** (never revoked); any non-zero `revoked_at` is the unix
// second at which it was revoked. This matches the integer-seconds convention
// Task 207 froze for `paired_at`. (`last_seen_at` population is deferred — it
// is an auth-path / `device.seen` concern, not device management — so V1.0
// always reports `0` until that lands.)
message DeviceEntry {
  // The device id: BLAKE2b-256(device_pubkey), hex-encoded — the `devices.id`
  // primary key (the cert/fingerprint form).
  string device_id = 1;
  // The user-supplied device name captured at pairing time.
  string name = 2;
  // The device's raw Ed25519 public key (32 bytes).
  bytes public_key = 3;
  // Unix seconds the device was paired (`devices.paired_at`).
  int64 paired_at = 4;
  // Unix seconds of last contact, or `0` when never recorded (NULL column).
  // Deferred: V1.0 always reports `0` (the auth path populates it later).
  int64 last_seen_at = 5;
  // Unix seconds the device was revoked, or `0` when still active. `0` ==
  // active (FROZEN sentinel — see the message comment above).
  int64 revoked_at = 6;
}

// Response for `Devices.ListDevices`: every paired device (active + revoked),
// most-recently-paired first.
message ListDevicesResponse {
  repeated DeviceEntry devices = 1;
}

// Inputs for `Devices.RevokeDevice` (design/12 §3.11, §7.3). Names the device
// to sever by its `devices.id` (hex BLAKE2b-256 fingerprint).
message RevokeDeviceRequest {
  // The hex device id (`devices.id`) to revoke. Revoking an already-revoked
  // device is an idempotent no-op success; an unknown id fails `NOT_FOUND`.
  string device_id = 1;
}

// Response for `Devices.GetCoreInfo` (design/12 §5.2). Carries the Core's
// identity + host/version so a client can confirm which Core it is paired with
// and carry `core_pubkey` forward (FROZEN field set).
message CoreInfo {
  // The Core's Ed25519 identity public key (32 bytes) — the same value the
  // device persisted at pairing time and validates the DeviceCert against.
  bytes core_pubkey = 1;
  // The Core binary version (`CARGO_PKG_VERSION`).
  string core_version = 2;
  // The Core host OS (`std::env::consts::OS`) — the same source `Runtime`'s
  // `ServerCapabilities.core_host_os` uses (Task 201).
  string core_host_os = 3;
  // The Core hostname (`hostname::get()`) — same source as
  // `ServerCapabilities.core_hostname` (Task 201).
  string core_hostname = 4;
}

// The device pairing + management service (design/12 §5.2).
//
// Task 207 locks the two pairing RPCs (StartPairing/CompletePairing). Task 209
// appends the three management RPCs below with NEW numbers; the pairing RPCs
// above keep their numbers untouched. Never reorder.
//
// DEFERRED (Decision D1): an `UpdateDevicePushToken(...)` RPC that writes the
// already-existing `devices.push_token` / `devices.push_platform` columns is
// **deferred to Phase 5** (notifications). No RPC in V1.0 writes those columns;
// when it lands it appends with a NEW number after `GetCoreInfo`.
service Devices {
  // Mint a one-shot pairing token (32 random bytes, 60 s TTL, ≤ 3 active,
  // in-memory only) and return the QR payload (design/12 §3.3, §6.2). The
  // operator triggers this from the tray / `concerto pair` CLI.
  rpc StartPairing(google.protobuf.Empty) returns (PairingChallenge);
  // Complete pairing: verify the device's signature over
  // `pairing_token || nonce || device_pubkey`, consume the token one-shot,
  // mint + sign a DeviceCert, insert the `devices` row, and return the signed
  // cert (opaque CBOR bytes, D1). Replays of a consumed token fail with
  // `FAILED_PRECONDITION` (`pairing.consumed`); expired tokens fail with
  // `FAILED_PRECONDITION` (`pairing.expired`); a bad signature fails with
  // `UNAUTHENTICATED` (design/12 §8).
  rpc CompletePairing(CompletePairingRequest) returns (CompletePairingResponse);
  // List every paired device (active + revoked), most-recently-paired first
  // (design/12 §5.2). Read-only.
  rpc ListDevices(google.protobuf.Empty) returns (ListDevicesResponse);
  // Revoke a device (design/12 §3.11, §7.3): persist `revoked_at`, insert the
  // device id into the shared revoked set the validator reads (so future
  // connects fail at auth), actively close any open sessions from that device,
  // then audit + broadcast `device.revoked`. Idempotent on an already-revoked
  // device (no-op success); an unknown id fails `NOT_FOUND`.
  rpc RevokeDevice(RevokeDeviceRequest) returns (google.protobuf.Empty);
  // Return the Core's identity + host/version (design/12 §5.2). Read-only; the
  // `core_pubkey` clients carry from pairing.
  rpc GetCoreInfo(google.protobuf.Empty) returns (CoreInfo);
}
