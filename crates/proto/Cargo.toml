[package]
name = "concerto-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "concerto_proto"
path = "src/lib.rs"

[dependencies]
# tonic re-enables the transport+codegen+prost feature set locally — the
# workspace pin is default-features = false (see workspace Cargo.toml).
tonic = { workspace = true, features = ["transport", "codegen", "prost"] }
prost = { workspace = true }
prost-types = "0.13"
serde = { workspace = true, features = ["derive"] }
# serde_json is only used by the `Option<prost_types::Struct>` serde shim in
# `serde_compat::option_struct`. Not on the gRPC hot path.
serde_json = { workspace = true }

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
