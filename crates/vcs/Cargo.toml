[package]
name = "concerto-vcs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "concerto_vcs"
path = "src/lib.rs"

[features]
# Task 313 (D2): the shared `wiremock`-backed VCS test double. Consumers
# (314/315/316/317/320/320.5) enable it as a dev-dependency:
#   concerto-vcs = { path = "../vcs", features = ["testkit"] }
# It pulls `wiremock` so `FakeGitHub`/`FakeLinear`/`FakeJira` can stand up a
# loopback `MockServer`. Off by default → a shipped Core never links wiremock.
testkit = ["dep:wiremock"]

[dependencies]
concerto-error = { path = "../error" }
concerto-persist = { path = "../persist" }
concerto-keychain = { path = "../keychain" }

# Task 313: the default GitHub backend. `octocrab` (rustls, NO native-tls/
# openssl — see the root Cargo.toml Task-313 pin note) backs `GitHubProvider`:
# REST for PR CRUD / merge / checks / deployments / issue fetch, GraphQL for the
# 316 review-thread stubs. Configurable base URL gives GitHub Enterprise (R-10).
octocrab = { workspace = true }
# Task 313: typed GraphQL codegen, frozen now + filled by 316.
graphql_client = { workspace = true }

# Task 317: the Linear (GraphQL POST) + Jira (REST GET) issue-fetch clients are
# hand-rolled over `reqwest` (the already-ratified rustls/no-openssl workspace
# pin, Task 112) — no Atlassian/Linear SDK, no extra cargo-deny surface. Same
# `ring` rustls posture as octocrab above (Windows-lane clean).
reqwest = { workspace = true }

# Task 314: the GitHub App option (R-7) mints an installation token by signing a
# short-lived JWT with the App private key (PEM, from
# `VcsSecretSlot::GithubAppPrivateKey`). `jsonwebtoken` is ALREADY in the lock at
# this exact version + feature set — octocrab's `jwt-rust-crypto` feature pins
# `jsonwebtoken/rust_crypto` (Task-313 pin note). Naming it as a direct dep with
# the SAME `default-features = false, features = ["use_pem", "rust_crypto"]`
# leaves `Cargo.lock` byte-identical (no new crate, no new advisory) — the
# RUSTSEC-2023-0071 (rsa) advisory it pulls is already operator-ratified +
# ignored in `deny.toml` (Task 313). `rust_crypto`, NOT `aws_lc_rs`, keeps the
# no-openssl / pure-Rust / Windows-lane posture.
jsonwebtoken = { version = "10", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
# Task 314: the rate-limit-pool path reads `X-RateLimit-*` headers off octocrab's
# raw `http::Response` + builds raw `http::Request`s (so the App installation
# token can be attached per-call + the headers captured). `http`/`http-body-util`/
# `bytes` are octocrab's own request/response types — already in the lock at these
# versions (transitive via octocrab/reqwest); naming them direct leaves the lock
# unchanged. Pure-Rust, cross-platform, already-allowed SPDX.
http = "1"
http-body-util = "0.1"
bytes = "1"

# Task 313: octocrab builds on `hyper-rustls`, which needs a process-level rustls
# `CryptoProvider`. The workspace links BOTH rustls backends (iroh's hickory tree
# pulls `aws-lc-rs`; octocrab's `rustls-ring` pulls `ring`), so rustls cannot
# auto-select a default and panics on the first TLS handshake under
# `cargo test --workspace` feature unification. We pin the **ring** provider
# explicitly (`default_provider().install_default()`, the same idempotent
# install the relay crate uses) before building any octocrab client — `ring`,
# NOT `aws-lc-rs`, to keep the no-openssl / pure-Rust / Windows-lane posture.
# `default-features = false` + `ring` mirrors `crates/relay/Cargo.toml`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# `fetch_issue(&Url)` takes `url::Url` (the FROZEN trait signature). Workspace
# pin (already in the graph via iroh/transport).
url = { workspace = true }

# The `gh` CLI fallback (`GitHubProviderViaCli`) writes the PR body to a temp
# file and passes `--body-file` (the title goes inline via `--title`) — moved
# from the V0.1 `crates/core/src/vcs/gh_cli.rs`. `tempfile` is workspace-vetted.
tempfile = "3"

# Task 315: the inbound-webhook HMAC-SHA256 verify (design/13 §3.2/§8). `hmac`'s
# `Mac::verify_slice` does the CONSTANT-TIME tag compare the design mandates
# (never `==` on the digest). RustCrypto, MIT/Apache-2.0, already in-tree.
hmac = { workspace = true }
sha2 = { workspace = true }
# `#[async_trait]` on the `VcsProvider` trait + the `Actor`-less handle. Workspace pin.
async-trait = { workspace = true }
# Caller-generated UUIDv7 ids for the `pull_requests` cache rows (moved from the
# V0.1 actor). Workspace pin.
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "sync", "time", "rt", "macros"] }
tracing = { workspace = true }
# The `VcsHandle::persistence_readers()` accessor returns `&sqlx::SqlitePool`
# (the FROZEN Task-45 signature the gRPC handler's repo→workarea lookup uses).
# Same feature subset as `concerto-persist`/`concerto-core`.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

# Task 313 (D2): `testkit` pulls the wiremock double. Optional → only present
# when the `testkit` feature is on (dev/test builds).
wiremock = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own Tier-2 tests turn on `testkit` to exercise `GitHubProvider`
# against the wiremock double + the recorded fixtures.
concerto-vcs = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wiremock = { workspace = true }
serde_json = { workspace = true }
