[package]
name = "concerto-gix-wrap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
# Task 303: `benches/sparse_fixture.rs` is a SHARED restore helper
# `#[path]`-included by the gate bench + the integration test — it is NOT a
# bench target itself. Disable bench autodiscovery so it never becomes one;
# the three real benches are declared explicitly in the `[[bench]]` stanzas.
autobenches = false

[lib]
name = "concerto_gix_wrap"
path = "src/lib.rs"

[dependencies]
concerto-error = { path = "../error" }
# Task 18: shell-out + gix hybrid per `design/02 §3.1`.
#   - `tokio` (`process` + `io-util` + `fs`) drives the `git` subprocess for
#     clone / worktree add and parses progress from its stderr.
#   - `gix` handles the read-only fast paths (rev-parse, list branches).
tokio = { workspace = true, features = ["process", "io-util", "fs", "macros", "rt", "sync"] }
tracing.workspace = true
gix = { workspace = true }

# Task 28: `is_fsmonitor_alive` probes a recorded `git fsmonitor--daemon`
# PID via `kill(pid, 0)` — same ESRCH/EPERM pattern as Task 11's
# pid_file. Unix-only; the V0.1 build matrix doesn't ship Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time", "sync"] }
tempfile = "3"
# Task 29: Criterion harness for `benches/status.rs`. `html_reports`
# pulls in `plotters` (MIT/Apache-2.0) which is fine; CI does not run
# the benches (only `cargo bench --no-run` validates compile).
criterion = { version = "0.5", features = ["html_reports"] }
# Task 303: restore the pre-packed sparse-cone fixture tar in the status
# bench gate + integration test. `tar` is the pure-Rust, cross-platform
# archive reader already pinned at the workspace level (Task 111); the
# fixture is UNCOMPRESSED so no compression-crate dep is needed (cargo deny
# stays green — no new workspace pin).
tar = { workspace = true }

# Task 29: bench harness. `harness = false` defers test running to
# criterion's `criterion_main!` macro.
[[bench]]
name = "status"
harness = false

# Task 104 (Phase 1 spike): sparse-cone status latency harness
# (shell-out vs gix-native, fsmonitor warm + cold). Throwaway spike, not
# a CI gate — CI only validates it compiles (`cargo bench --no-run`).
[[bench]]
name = "sparse_cone"
harness = false

# Task 303: the status sparse-cone bench GATE. Restores a pre-packed
# fixture + asserts `git status` p50 < 100 ms (design/00 §7.7), exiting
# non-zero on regression. `criterion_main!` provides the harness.
[[bench]]
name = "status_sparse_gate"
harness = false
