# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Enforces the licensing posture from design/00 §6.11: only permissive
# licenses (MIT/Apache-2.0/BSD/ISC/0BSD) reach distribution; GPL/AGPL/SSPL/BSL
# transitive deps fail CI.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "MIT-0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # Permissive, OSI/FSF approved, attribution-only (no copyleft). Added in
    # Task 05 because sqlx 0.8 → hashbrown 0.15 → foldhash is Zlib-licensed.
    # Posture-equivalent to BSD-2-Clause.
    "Zlib",
    # File-level weak copyleft. Added in Task 14 because Tauri 2's tree pulls
    # in cssparser / cssparser-macros / selectors / dtoa-short (via tauri-utils
    # → dom_query) and option-ext (via tauri → dirs → dirs-sys). MPL's
    # copyleft trigger fires only on modifications to the MPL'd source files
    # themselves — we consume these crates as unmodified upstream binaries,
    # so the obligation never attaches. Operator-ratified 2026-05-28.
    "MPL-2.0",
    # Apache-2.0 with the LLVM-style "patent grant + linking exception"
    # rider. OSI/FSF-approved permissive. Added in Task 14 because
    # `target-lexicon` (a Linux-only `system-deps` build-time dep pulled in
    # by Tauri's gtk/webkit chain) ships under this combined identifier.
    "Apache-2.0 WITH LLVM-exception",
    # Public-domain dedication. FSF-approved as a free license; functionally
    # equivalent to a no-attribution permissive license (no copyleft, no
    # patent grant restrictions). Added in Task 42 because `notify` (the
    # cross-platform filesystem-watch crate we use for managed.json
    # hot-reload) is licensed CC0-1.0. The dedication is unilateral by the
    # upstream maintainers; we redistribute the compiled artifact under our
    # own permissive terms.
    "CC0-1.0",
    # Permissive data-sharing license (Linux Foundation). Added in Task 53
    # because `tauri-plugin-updater` → `reqwest` → `rustls-platform-verifier`
    # → `webpki-root-certs` ships the Mozilla CA bundle under CDLA-2.0. The
    # data is a verbatim copy of Mozilla's trust store — no copyleft, no
    # patent grant restrictions; redistribution is unrestricted as long as
    # the license text accompanies it (already in the crate's source tree).
    # Operator-ratified 2026-05-28.
    "CDLA-Permissive-2.0",
    # Public-domain dedication (OSI-approved, FSF Free/Libre). Added in Task 212
    # because `iroh-relay 0.98.0` pulls a WASM-only websocket subtree
    # (`ws_stream_wasm` → `pharos` / `async_io_stream`) licensed `Unlicense`.
    # Functionally equivalent to the already-allowed `CC0-1.0` / `0BSD`: a
    # unilateral dedication of the work to the public domain — no copyleft, no
    # patent-grant restrictions, redistribution unrestricted. The subtree is the
    # browser (wasm32) relay-client path; it does not compile into the native
    # Core/relay binaries, but cargo-deny evaluates the whole graph, so the
    # expression is ratified here. Operator-ratified 2026-06-03.
    "Unlicense",
]
confidence-threshold = 0.93

[bans]

[advisories]
version = 2
yanked = "deny"
# Task 212: two RUSTSEC advisories on `hickory-proto` / `hickory-net`
# 0.26.0-beta.4 — the DNS resolver `iroh = 0.98.2` pins EXACTLY
# (`hickory-resolver = "=0.26.0-beta.4"`). The fixes (`>= 0.26.1`) live on the
# stable 0.26 line; the beta line iroh pins has no patched release, so the only
# way to clear them is to bump iroh — which the validated spike-102 trio
# (iroh 0.98.2 / iroh-relay 0.98.0 / tonic 0.12.3) forbids without a re-spike
# (see the root Cargo.toml Task-212 pin note). Both advisories are remote-DoS in
# the **DNS-discovery** path (a malicious DNS response drives an unbounded loop /
# O(n²) CPU during NSEC3 proof validation / message encoding) — NOT RCE, auth
# bypass, or data disclosure. The transport deliberately allows a **directly
# supplied Core address / relay** (spike Note B, `design/11 §8`), so DNS/pkarr
# discovery is not load-bearing and can be bypassed entirely. Scoped to these
# two IDs only — every other advisory still fails the gate. **Flagged in the
# Task-212 Handoff as an operator stop-and-ask: revisit when iroh ships a 0.99
# (or a 0.98.x that re-pins hickory >= 0.26.1) and re-validate the adapter.**
# Operator-ratified 2026-06-03.
ignore = [
    "RUSTSEC-2026-0119", # hickory-proto 0.26.0-beta.4: O(n²) name-compression CPU exhaustion (DNS encode path; fixed in 0.26.1, unreachable under iroh's =beta.4 pin)
    "RUSTSEC-2026-0120", # hickory-net   0.26.0-beta.4: NSEC3 closest-encloser unbounded loop (cross-zone DNS responses; fixed in 0.26.1, unreachable under iroh's =beta.4 pin)
]
# `unmaintained` advisories on transitive deps are demoted from error to
# informational. Tauri 2's tree carries several: gtk-rs GTK3 bindings
# (Linux-only; gtk-rs has moved to GTK4 and V0.1 desktop is macOS only),
# `proc-macro-error` and the `unic-*` cluster (build-time macros only,
# no runtime surface). Direct workspace deps still trigger if they go
# unmaintained — only the transitive surface is muted. Set in Task 14.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
