[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/relay",
    "crates/cli",
    "crates/proto",
    "crates/transport",
    "crates/identity",
    "crates/gix-wrap",
    "crates/keychain",
    "crates/persist",
    # Task 313: dedicated VCS Provider Integration crate (`design/13`). Houses
    # the FROZEN `VcsProvider` trait + octocrab `GitHubProvider` + `gh`-CLI
    # fallback + the `testkit` wiremock harness. Sibling of `crates/relay`/
    # `crates/transport`; the Core depends on it. Contains the octocrab/
    # graphql_client tree so the rest of the workspace's dep graph stays bounded.
    "crates/vcs",
    "crates/agent-host",
    "crates/error",
    # Task 14: Tauri 2 shell. Lives under `apps/desktop/src-tauri/`
    # because Tauri's scaffolding expects that layout.
    "apps/desktop/src-tauri",
    # Task 15: smoke-test client binary. Lives under `tools/` because
    # it is dev-tooling, not a shipped product. `scripts/smoke.sh`
    # runs it via `cargo run --bin smoke-client`.
    "tools/smoke-client",
    # Task 220: split-host-loopback smoke driver. Boots an Iroh-enabled Core
    # in-process + pairs a synthetic device over the 0x03 channel + drives an
    # IROH-tagged unary RPC + Streams.Subscribe + Files round-trip over Iroh +
    # Noise IK. Run by scripts/smoke.d/97-split-host-loopback.sh (macOS-only at
    # runtime; builds on every lane).
    "tools/split-host-loopback",
    # Cross-machine pairing verification tools (dev/test, not shipped product).
    # `pair-serve` (Core side, macOS-only at runtime) + `pair-dial` (client side,
    # MINIMAL deps so it builds on a small box) split `tools/split-host-loopback`
    # into a two-process, relay-capable, cross-machine Iroh pairing flow.
    "tools/pair-serve",
    "tools/pair-dial",
    # Task 17: shared integration-test harness. Dev-deps-only crate —
    # callers pin it as a `[dev-dependencies]` path entry. Lives in the
    # workspace so `cargo test --workspace` builds its self-tests but
    # nothing in the production build links against it.
    "crates/test-harness",
]
default-members = ["crates/core", "crates/cli"]
# Task 208: the cargo-fuzz crate (`crates/identity/fuzz`) is EXCLUDED from the
# parent workspace. It needs nightly + a libFuzzer toolchain that the stable CI
# lanes (`cargo check/clippy/test --workspace`, `cargo bench --no-run`) lack, so
# it must never be pulled into the workspace build. It carries its own empty
# `[workspace]` table too (the cargo-fuzz convention); this `exclude` is the
# belt-and-suspenders so `cargo --workspace` never tries to compile it. Build it
# only via `cargo +nightly fuzz build` (typically the Linux CI lane).
exclude = ["crates/identity/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Concerto contributors"]
# Task 18 bump: gix 0.77 (chosen to clear RUSTSEC-2025-0140 in
# `gix-date` < 0.12) needs rustc 1.82. CI rustc is on 1.95+; the bump
# is benign for everything already in the workspace.
rust-version = "1.82"

[workspace.dependencies]
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
thiserror = "1"
serde = "1"
serde_json = "1"
# sqlx/tonic ship a lot of default features (runtimes, transports, codegen).
# Default off here; crates that need them re-enable specific features locally.
# sqlx pinned to 0.8 — 0.7.x is RUSTSEC-2024-0363 (binary protocol cast bug).
sqlx = { version = "0.8", default-features = false }
# tonic 0.12 (was 0.11) — Task 06 pin. prost 0.13 follows tonic 0.12's
# version coupling. Both stay default-features = false at the workspace
# level; crates re-enable the feature subsets they actually need.
tonic = { version = "0.12", default-features = false }
prost = "0.13"
# keyring 3 (was 2) — Task 10 pin. v3 is the current published stable
# (v4 exists but the design doc named v4 before v3 stabilized; sticking to
# v3 keeps the API surface that Task 10's spec was written against).
# Default features off; crates that need a backend opt in (e.g.
# `apple-native` on macOS, `linux-native` on Linux). Workspace-level dep
# is bare-name + version; per-crate Cargo.toml sets `features = [...]`.
keyring = { version = "3", default-features = false }
secrecy = "0.10"
zeroize = "1"
# RustCrypto `hmac` + `sha2` for the inbound-webhook HMAC-SHA256 verify
# (Task 315, design/13 §3.2/§8). Pure-Rust, MIT/Apache-2.0 (cargo-deny-clean),
# already in-tree transitively. `hmac`'s `Mac::verify_slice` does the
# **constant-time** tag compare the design mandates (never `==` on the digest).
hmac = "0.12"
sha2 = "0.10"
# `home` for home_dir(); rust-lang's own crate, MIT/Apache-2.0. Picked
# over `dirs` because `dirs` pulls in `option-ext` (MPL-2.0) — disallowed
# by design/00 §6.11's permissive-only license posture.
home = "0.5"
# Single-instance guard uses fs2's cross-platform advisory file locks
# (flock on Unix, LockFileEx on Windows). Task 11 pin. MIT/Apache-2.0.
fs2 = "0.4"
# tokio-util gives us CancellationToken (broadcast shutdown primitive).
# Task 11 pin. MIT-licensed.
tokio-util = "0.7"
# async-trait powers the `Actor` trait's async `run` method. Task 12 pin.
# MIT/Apache-2.0. Vetted: zero runtime deps, codegen-only.
async-trait = "0.1"
# futures gives us `FutureExt::catch_unwind` (around `AssertUnwindSafe`).
# Task 12 pin. MIT/Apache-2.0. Default-on is fine here; the supervisor uses
# the `std` feature only via the `FutureExt` extension trait.
futures = "0.3"
# Task 13: gRPC server over UDS plumbing.
#
# - `tower = "0.5"` — service trait that tonic builds on. tonic 0.12 expects
#   tower 0.5; pinning here keeps the dependency tree consistent.
# - `hyper-util = "0.1"` — `hyper`'s helper crate (rt/server adapters); tonic
#   re-exports parts of it but a couple of UDS bind paths use it directly.
# - `tokio-stream = "0.1"` — `UnixListenerStream` wrapper, the canonical way
#   to feed a `UnixListener` to `Server::serve_with_incoming`.
# - `hostname = "0.4"` — fills `ServerCapabilities.core_hostname`.
# All MIT/Apache-2.0; cargo-deny clean.
tower = "0.5"
hyper-util = "0.1"
tokio-stream = "0.1"
hostname = "0.4"
# Task 204: Connect-Web bridge — gRPC-Web framing layered onto the same
# Tonic services the UDS server hosts. `tonic-web = "0.12"` tracks the
# `tonic = "0.12"` pin (its `GrpcWebLayer` is version-coupled to tonic's
# tower-layer plumbing). tonic-web's server IS a hyper server underneath,
# so this satisfies `design/11 §3.4` Path A's "tiny hyper server" without a
# separate direct `hyper` pin. Cross-platform (pure TCP + http framing — no
# `#[cfg(unix)]`), so it builds on the Windows CI lane (Task 113). MIT;
# transitive tree (base64 / http-body-util / pin-project / tower-http 0.5)
# is all MIT/Apache-2.0 — already covered by `deny.toml`, no new SPDX.
tonic-web = "0.12"
# Task 18: gix powers the read-only git operations in `concerto-gix-wrap`
# (rev-parse, list-branches). Heavy write paths (clone, worktree add)
# shell out to `git` per `design/02 §3.1`. `default-features = false`
# trims the feature set to what we actually use; `max-performance-safe`
# keeps the SIMD / parallel knobs on without unsafe code, `revision`
# enables rev-parse, and `blocking-network-client` is harmless — it
# lands the network glue without forcing a particular TLS backend.
# Pinned at 0.66 (Task 18 drift note) — vetted MIT/Apache-2.0 transitively.
gix = { version = "0.77", default-features = false, features = ["max-performance-safe", "blocking-network-client", "revision"] }
# Task 18: UUIDv7 for `repositories.id`. `v7` enables monotonic time-based
# IDs (design/09 §4.1 — UUIDv7 is the schema convention). MIT/Apache-2.0;
# already pulled transitively, pinning at the workspace level keeps the
# version honest.
uuid = { version = "1", features = ["v7"] }
# Task 22: OS-provided randomness for the 32-byte session cookie the
# Core supplies to `concerto-agent-host` over the bridge `Hello`.
# MIT/Apache-2.0; already pulled transitively via sqlx.
getrandom = "0.2"
# Task 27: CLI parser for the smoke-client subcommand surface. Already
# pinned at v4 by `concerto-agent-host` (Task 21); promoted to a
# workspace dep so smoke-client doesn't duplicate the version literal.
# MIT/Apache-2.0; the `derive` feature pulls in `clap_derive`'s
# proc-macro infrastructure (codegen-only, no runtime deps beyond what
# clap itself already brings).
clap = { version = "4", features = ["derive"] }
# Task 30: gitignore-aware walker used by the files-to-copy resolver
# (`crates/core/src/workspace_manager/files_to_copy.rs`). The `ignore`
# crate ships the same gitignore matcher BurntSushi/ripgrep uses, which
# is exactly the syntax `design/03 §3.10` describes for
# `.worktreeinclude`. The walker is sync; the Workarea Manager wraps
# calls into it with `tokio::task::spawn_blocking` to keep the runtime
# unblocked. MIT/Apache-2.0; transitively pulled by gix already so the
# tree cost is essentially zero.
ignore = "0.4"
# Task 30: relative-path arithmetic for the files-to-copy resolver's
# symlink mode — `pathdiff::diff_paths` computes the relative target a
# workarea symlink should point at, which keeps workareas movable.
# MIT/Apache-2.0; tiny crate (one function).
pathdiff = "0.2"
# Task 33: the Agent Supervisor's terminal-mode parser packs match
# tool-approval prompts in the agent's rendered stdout via the
# `regex` crate. `regex` is already pulled in transitively by `ignore`
# (Task 30) and by tracing-subscriber's env-filter; promoting it to a
# workspace dep keeps the version literal honest. MIT/Apache-2.0.
regex = "1"
# Task 35: parse Codex's `~/.codex/config.toml` for its MCP server
# section. `toml` is the canonical Rust TOML parser (used by Cargo
# itself); MIT/Apache-2.0. Default features include `parse` + `display`
# which is all we need for the read-only listing surface.
toml = "0.8"
# Task 39: parse the YAML frontmatter in `SKILL.md` files. `serde_yaml`
# is the de-facto Rust YAML lib (MIT/Apache-2.0). The skills registry
# parses the chunk between the first and second `---` lines with
# `serde_yaml::from_str::<SkillFrontmatter>` and falls back gracefully
# on parse errors.
serde_yaml = "0.9"
# Task 41: lexical path normalization for the filesystem allow/deny
# policy in `crates/core/src/security/path_policy.rs`. `path-clean` is a
# tiny crate (≈100 lines, MIT) that implements Rob Pike's path.Clean
# algorithm — it collapses `..` / `.` / repeated separators WITHOUT
# touching the filesystem. We use it as the fallback when
# `std::fs::canonicalize` fails (e.g. the path doesn't exist yet), so a
# write to `<allow>/new-file` still classifies as Allowed and a write to
# `<deny>/new-file` still classifies as Denied. MIT-licensed; no
# transitive deps.
path-clean = "1"
# Task 203: BLAKE2b checksum for `Files.Upload`/`Download` integrity. The
# digest is computed incrementally over the streamed byte stream (256 KiB
# chunks) and verified on finalize before the atomic rename. We pin
# BLAKE2b-256 (`Blake2b<U32>` via the RustCrypto `digest` API). MIT OR
# Apache-2.0 — clears `deny.toml`. Introduced here; Task 205 reuses this
# single workspace pin for its `device_id` BLAKE2b hash (per the Task 203
# input note — `blake2` ends up a single workspace pin either way).
blake2 = "0.10"
# Task 42: cross-platform filesystem notifications for the managed.json
# hot-reload watcher in `crates/core/src/security/managed.rs` (and, since
# Task 310, the checked-in `project_settings.json` watcher in
# `crates/core/src/settings/`). Pinned to notify 8 (current stable; v9 is
# still RC at this writing). CC0-1.0 itself — a public-domain dedication,
# functionally permissive and compatible with the design/00 §6.11
# "permissive-only" posture; the license is added to `deny.toml` with a
# justification. The watcher debounces events at 500ms and broadcasts the
# parsed value via a `tokio::sync::watch::Sender`.
#
# Task 310: the feature set is a `[target.*]` split (see below the
# `[workspace.dependencies]` table) so the Windows/Linux Core CI lanes
# (Task 113) get the right backend — `macos_fsevent` on macOS, the portable
# default backends (ReadDirectoryChangesW on Windows, inotify on Linux) on
# the other two lanes. The base entry carries no features; the per-target
# entries add them.
notify = { version = "8", default-features = false }
# Task 111: `concerto backup` streams the worktree directory tree into
# `<out>/worktrees.tar`. `tar` is the pure-Rust, fully cross-platform archive
# writer from the rust-lang org — it compiles on the Windows CI lane (no
# `#[cfg(unix)]` paths in the write path) and `Builder::append_dir_all`
# streams each file rather than buffering whole worktrees in memory.
# MIT/Apache-2.0; cargo-deny clean.
tar = { version = "0.4", default-features = false }
# Task 112: `HttpsForwarderSubscriber` POSTs audit events (NDJSON) to a
# configured endpoint. `reqwest` is the async HTTP client; we pin the
# rustls-tls backend (NOT openssl/native-tls) so it builds on the Windows
# CI lane and stays cargo-deny clean — `apps/desktop` already pulls
# reqwest with rustls transitively (via tauri-plugin-updater), so the
# license posture (rustls/ring/webpki-root-certs) is already ratified in
# deny.toml. `default-features = false` drops the default native-tls;
# reqwest 0.13 names the rustls backend feature `rustls` (the 0.12-era
# name was `rustls-tls`). `http2` keeps the HTTP/2 POST path. No
# native-tls / openssl anywhere. MIT/Apache-2.0.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
# Task 205: identity crypto primitives (`crates/identity`).
#
# - `ed25519-dalek = "2"` — the standard pure-Rust Ed25519 signature impl
#   (RustCrypto / dalek-cryptography). BSD-3-Clause; clears `deny.toml`. We
#   enable `zeroize` so `SigningKey` zeroes its secret scalar on drop and
#   `std` for the error types. We do NOT enable the `rand_core` feature: key
#   generation fills 32 OS-random bytes via the already-pinned `getrandom`
#   crate and calls `SigningKey::from_bytes`, which avoids coupling to a
#   specific `rand_core` major (dalek 2 wants rand_core 0.6; the rest of the
#   workspace is mixed) and keeps the dep tree minimal.
# - `curve25519-dalek` is pulled transitively by ed25519-dalek (BSD-3-Clause);
#   not a direct dep, listed here only for the license note.
# - `ciborium` — deterministic-CBOR codec. Already used by `concerto-agent-host`
#   (the HostFrame wire codec) at the same `"0.2"`; promoted to a workspace pin
#   here so the cert codec and the frame codec share one version literal.
#   MIT-licensed; cargo-deny clean. The `DeviceCert` is a `serde`-derived
#   struct, so ciborium serializes its fields in declaration order — that
#   field order IS the frozen wire order (asserted by the byte-stability and
#   known-answer tests in `crates/identity/tests/cert_vectors.rs`).
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
ciborium = "0.2"
# Task 207: `snow` (pure-Rust Noise Protocol Framework) powers the device-pairing
# Noise XX handshake bootstrapped by the one-shot pairing token (used as the
# Noise PSK). Pinned at 0.9 (resolves 0.9.6) NOT 0.10: snow 0.10 declares
# `rust-version = 1.85`, above the workspace MSRV of 1.82 (`[workspace.package].
# rust-version`); 0.9.6 has the same `XXpsk3` pattern surface and no MSRV
# floor. `default-features = false` + `default-resolver` selects the pure-Rust
# crypto backend (no `ring`/libsodium C deps), keeping the Windows CI lane green
# and the dep tree pure-Rust. License `Apache-2.0 OR MIT` → cargo-deny selects
# MIT (already on the allow-list); no new SPDX expression. The aes-gcm/blake2/
# sha2/chacha20poly1305/curve25519-dalek features back the `_25519_AESGCM_SHA256`
# cipher suite this task's protocol string names.
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
# Task 212: the production Iroh QUIC transport (`crates/transport`). EXACT pins
# — this is the validated trio spike 102 (`design/spikes/tonic-iroh-findings.md`
# §2) + spike 101 (`design/spikes/iroh-nat-findings.md` §5) measured against the
# production `tonic = 0.12.3` / `prost = 0.13.5` stack: the hand-rolled
# tonic-0.12 ↔ Iroh-bidi-stream adapter clears both perf bars with NO schema or
# codegen change. Do NOT bump within V1.0 without a re-spike (a bump to e.g.
# iroh 0.99 changes the QUIC/relay wire and would force re-validating the
# adapter + the NAT matrix). `iroh-relay` is the companion relay protocol crate;
# the transport pulls it only behind its `dev-relay` feature for the Tier-2
# loopback double (an in-process `iroh-relay --dev` instance), and Task 214's
# relay binary pulls it directly. Both are pure-Rust QUIC (quinn/rustls/ring),
# cross-platform (Windows/Linux/macOS) — no `#[cfg(unix)]` on the transport
# core. The license tree is ratified in `deny.toml` (see the Task-212 block).
iroh = "=0.98.2"
iroh-relay = "=0.98.0"
# Task 213: mDNS LAN discovery for the Core (`crates/transport`,
# `design/11 §3.5`). `mdns-sd` is a pure-Rust mDNS/DNS-SD responder + browser in
# one crate — it publishes the `_concerto._tcp.local` service (TXT:
# endpoint_id/core_pubkey/version/caps) and browses for it. Chosen over
# hand-rolling dual-stack sockets because it registers A **and** AAAA records and
# accepts either out of the box (`design/11 §12 R-3` — support both v4 and v6),
# and (load-bearing for our Tier-2 CI hermeticity) it enables the loopback
# interfaces (`LoopbackV4`/`LoopbackV6`) by default, so the responder+browser
# double resolves over loopback multicast with no real LAN / no external network
# — exactly what a headless CI network sandbox needs. Pure-Rust + cross-platform
# (Windows/Linux/macOS via `if-addrs` + `socket2`; no `#[cfg(unix)]` on the
# discovery path → the Task-113 Windows lane stays green). License
# `Apache-2.0 OR MIT`; its small transitive tree (`if-addrs` MIT/BSD-3-Clause,
# `socket-pktinfo`/`flume`/`fastrand` MIT/Apache-2.0) is already on the
# `deny.toml` allow-list — no new SPDX to ratify. Not pinned to an exact patch
# (unlike the iroh trio): mDNS is a self-contained leaf with a stable wire
# format, not part of the spike-validated QUIC stack. `default-features = false`
# drops the `async` (flume/async) feature; the transport crate opts into
# `logging` locally.
mdns-sd = { version = "0.20", default-features = false }
# Task 214: Prometheus metrics for the self-hosted relay binary
# (`crates/relay`, `design/11 §6.3`). The `prometheus` crate is the maintained,
# de-facto Rust client (registry + `TextEncoder` exposition) — the relay serves
# the FROZEN `concerto_relay_*` metric names over a minimal TCP handler on
# `PROMETHEUS_LISTEN_ADDR`, so no `metrics-exporter-prometheus` HTTP framework is
# needed. License `Apache-2.0 OR MIT` → cargo-deny selects MIT (already on the
# allow-list); no new SPDX. `default-features = false` drops the optional
# `protobuf` exposition format and the `process`/`libc` collectors (the relay
# exports only its own app metrics), keeping the dep tree small + cross-platform
# (Windows/Linux/macOS — the relay's Docker artifact is Linux, the Windows CI
# lane compiles it). Not exact-pinned: it is a self-contained observability leaf
# with a stable API, not part of the spike-validated QUIC trio.
prometheus = { version = "0.13", default-features = false }
# Task 215: the WSS↔Iroh bridge at the self-hosted relay (`crates/relay`,
# `design/11 §3.4` Path B). `tokio-tungstenite` is the focused async WebSocket
# server/client layered over the relay's existing tokio runtime — it gives the
# clean WSS framing surface (binary frames map 1:1 onto the Iroh bidi stream) the
# bridge's opaque byte pump needs, with no HTTP framework. TLS is **rustls** (NOT
# native-tls/openssl) matching the `reqwest`-rustls posture (Task 112) — the
# `rustls-tls-webpki-roots` feature pulls `tokio-rustls 0.26` over the already-
# present `rustls 0.23`/`ring` stack (Windows-lane friendly, no C TLS dep). The
# bridge terminates the browser's outer `wss://` TLS; the inner Noise IK
# (`design/12 §3.4`) keeps the relay ciphertext-only (`design/11 §3.9`).
# `tungstenite`/`tokio-tungstenite` are MIT (already on the deny allow-list).
# Not exact-pinned (a self-contained WebSocket leaf with a stable wire format,
# not part of the spike-validated QUIC trio).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# Task 217: `design/11 §5.1`'s FROZEN `TransportHandle::switch_relay(url: Url)`
# names `url::Url` verbatim — the public relay-URL type the api_server / Desktop
# (Task 218) build against. `url` is ALREADY in the build graph (iroh 0.98 pulls
# it transitively for relay/pkarr discovery, see `cargo tree -i url`), so making
# it a direct dep of `concerto-transport` adds NO new crate to compile and NO new
# SPDX to ratify (MIT/Apache-2.0, already on the `deny.toml` allow-list). Pinned
# at the workspace level to keep the version literal honest; not exact-pinned (a
# stable, self-contained leaf — not part of the spike-validated QUIC trio).
url = "2"
# Task 313: the native GitHub API client for `crates/vcs` (`design/13 §3.1`
# "octocrab native + gh CLI fallback"). `octocrab` is the maintained, de-facto
# Rust GitHub client (REST + GraphQL); it backs the default `GitHubProvider`
# (PR CRUD / merge / checks / deployments / issue fetch). TLS is **rustls**, NOT
# native-tls/openssl: `default-features = false` drops octocrab's default
# `default-client` (which would pull native-tls) and we opt into `rustls` only,
# which routes through `hyper-rustls 0.27` over the already-present rustls/ring
# stack — `cargo tree -i openssl-sys` / `-i native-tls` are both EMPTY (verified
# in-task), keeping the Windows CI lane (Task 113) green and the deny.toml
# license posture unchanged (octocrab + its tree — arc-swap/snafu/jsonwebtoken/
# secrecy 0.10/chrono/http-serde/tower-http — all resolve to MIT/Apache-2.0/BSD,
# already on the allow-list; vetted cargo-deny-clean before this landed). Not
# exact-pinned (a self-contained API-client leaf with a stable surface, not part
# of the spike-validated QUIC trio). `jwt-rust-crypto` selects octocrab's
# **pure-Rust** JWT signing backend (`jsonwebtoken` over RustCrypto) for the
# GitHub App path (Task 314) — NOT `jwt-aws-lc-rs`, which would pull the
# `aws-lc-rs` C/assembly crypto lib and break the Windows lane + the no-openssl
# posture. octocrab 0.53 `compile_error!`s unless exactly one JWT backend is on.
# `default-client` provides the `hyper-util` legacy client `build()` (the real
# constructor); `rustls-ring` pins `hyper-rustls`' crypto backend to **ring**
# (the same backend iroh/transport already use — NOT aws-lc-rs), so the whole
# tree is pure-Rust + cross-platform. This mirrors octocrab's own `default`
# feature set minus the `opentls`/native-tls path (which `default-features =
# false` drops) — `cargo tree -i openssl-sys` / `-i native-tls` stay EMPTY.
# `rustls-webpki-tokio` makes octocrab's `build()` use `hyper-rustls`'s
# `with_webpki_roots()` (the bundled Mozilla CA set) instead of
# `with_native_roots()`. The native path loads the OS trust store at
# client-build time; on macOS that calls the Security framework
# (`SecTrustSettingsCopyCertificates`), which is NOT concurrency-safe across
# threads or processes — under `cargo test --workspace` parallelism the keychain
# read intermittently returns OS error -36 (`ioErr`), which octocrab surfaces as
# `Error::Other { "no native root CA certificates found" }` and flaked the vcs
# tests. webpki roots are pure-Rust + cross-platform (strictly better for the
# no-openssl / Windows-lane posture) and validate `api.github.com` fine.
octocrab = { version = "0.53", default-features = false, features = [
    "rustls",
    "rustls-ring",
    "rustls-webpki-tokio",
    "default-client",
    "jwt-rust-crypto",
] }
# Task 313: typed GraphQL request/response codegen for the GitHub GraphQL API
# (review-thread fetch/resolve — `design/13 §3.6`). 313 freezes the
# `list_review_threads`/`resolve_thread` trait signatures as implemented-stubs;
# Task 316 fills the bodies using `graphql_client`'s derive to type the queries.
# Pinned here (the workspace pin keeps 313 + 316 on one version literal) but kept
# as a light dep in `crates/vcs` now. License `Apache-2.0 OR MIT` → cargo-deny
# selects MIT (already on the allow-list); no new SPDX. Pure-Rust, cross-platform.
graphql_client = { version = "0.16", default-features = false }
# Task 313: the shared VCS test double (`design/13 §10` names wiremock). A
# `wiremock`-backed `MockServer` stands in for the GitHub/Linear/Jira REST +
# GraphQL endpoints so the Tier-2 `testkit` harness (FROZEN, reused by
# 314/315/316/317/320/320.5) can prove provider logic against recorded fixtures
# with no live API. **Dev/`testkit`-only** — never linked into a shipped binary.
# License `Apache-2.0 OR MIT` → cargo-deny selects MIT (already on the allow-list);
# its tree (`http-types`/`deadpool`/`assert-json-diff`) is permissive, vetted
# cargo-deny-clean. Pure-Rust, cross-platform.
wiremock = "0.6"
# Task 401: `rmcp` — the official Rust SDK for the Model Context Protocol
# (https://github.com/modelcontextprotocol/rust-sdk). It backs the FIRST MCP
# *server* in the codebase: the in-process `concerto-maestro-mcp` stdio server
# (`crates/core/src/maestro/mcp.rs`) the spawned Maestro CLI dials via its own
# `--mcp-config` + `--strict-mcp-config` (design/08 §3.2, PHASE4_PLANNING D3/§4.1).
# We enable only `server` (the `ServerHandler` trait + tool registry), `macros`
# (the `#[tool_router]`/`#[tool_handler]` attribute macros), and `transport-io`
# (the stdio/`AsyncRead`+`AsyncWrite` duplex transport the in-process pipe-pair
# rides). NO `reqwest`/`*-http`/`native-tls` features — Maestro's MCP channel is
# a local stdio pipe to the agent host, not a network listener — so the tree
# stays openssl-free (`cargo tree -i openssl-sys` stays EMPTY, Task 112 posture).
# License `Apache-2.0` (clears `deny.toml`'s allow-list); its transitive tree
# (`schemars`/`serde`/`tokio`/`pin-project-lite`/`pastey`/…) is all permissive
# MIT/Apache-2.0, already ratified. `cargo deny check` is run on the resolved
# tree before commit; any new SPDX or advisory is an operator Stop-and-ask.
rmcp = { version = "1", default-features = false, features = ["server", "macros", "transport-io"] }
