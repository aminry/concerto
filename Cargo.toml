[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/relay",
    "crates/cli",
    "crates/proto",
    "crates/transport",
    "crates/gix-wrap",
    "crates/keychain",
    "crates/pty-sup",
    "crates/desktop-shell",
    "crates/persist",
    "crates/agent-host",
    "crates/error",
    # Task 14: Tauri 2 shell. Lives under `apps/desktop/src-tauri/`
    # because Tauri's scaffolding expects that layout; the existing
    # `crates/desktop-shell` is reserved for shared Rust helpers that
    # the Tauri app will depend on in a later task.
    "apps/desktop/src-tauri",
]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Concerto contributors"]
rust-version = "1.78"

[workspace.dependencies]
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
thiserror = "1"
serde = "1"
serde_json = "1"
# sqlx/tonic ship a lot of default features (runtimes, transports, codegen).
# Default off here; crates that need them re-enable specific features locally.
# sqlx pinned to 0.8 — 0.7.x is RUSTSEC-2024-0363 (binary protocol cast bug).
sqlx = { version = "0.8", default-features = false }
# tonic 0.12 (was 0.11) — Task 06 pin. prost 0.13 follows tonic 0.12's
# version coupling. Both stay default-features = false at the workspace
# level; crates re-enable the feature subsets they actually need.
tonic = { version = "0.12", default-features = false }
prost = "0.13"
# keyring 3 (was 2) — Task 10 pin. v3 is the current published stable
# (v4 exists but the design doc named v4 before v3 stabilized; sticking to
# v3 keeps the API surface that Task 10's spec was written against).
# Default features off; crates that need a backend opt in (e.g.
# `apple-native` on macOS, `linux-native` on Linux). Workspace-level dep
# is bare-name + version; per-crate Cargo.toml sets `features = [...]`.
keyring = { version = "3", default-features = false }
secrecy = "0.10"
zeroize = "1"
# `home` for home_dir(); rust-lang's own crate, MIT/Apache-2.0. Picked
# over `dirs` because `dirs` pulls in `option-ext` (MPL-2.0) — disallowed
# by design/00 §6.11's permissive-only license posture.
home = "0.5"
# Single-instance guard uses fs2's cross-platform advisory file locks
# (flock on Unix, LockFileEx on Windows). Task 11 pin. MIT/Apache-2.0.
fs2 = "0.4"
# tokio-util gives us CancellationToken (broadcast shutdown primitive).
# Task 11 pin. MIT-licensed.
tokio-util = "0.7"
# async-trait powers the `Actor` trait's async `run` method. Task 12 pin.
# MIT/Apache-2.0. Vetted: zero runtime deps, codegen-only.
async-trait = "0.1"
# futures gives us `FutureExt::catch_unwind` (around `AssertUnwindSafe`).
# Task 12 pin. MIT/Apache-2.0. Default-on is fine here; the supervisor uses
# the `std` feature only via the `FutureExt` extension trait.
futures = "0.3"
# Task 13: gRPC server over UDS plumbing.
#
# - `tower = "0.5"` — service trait that tonic builds on. tonic 0.12 expects
#   tower 0.5; pinning here keeps the dependency tree consistent.
# - `hyper-util = "0.1"` — `hyper`'s helper crate (rt/server adapters); tonic
#   re-exports parts of it but a couple of UDS bind paths use it directly.
# - `tokio-stream = "0.1"` — `UnixListenerStream` wrapper, the canonical way
#   to feed a `UnixListener` to `Server::serve_with_incoming`.
# - `hostname = "0.4"` — fills `ServerCapabilities.core_hostname`.
# All MIT/Apache-2.0; cargo-deny clean.
tower = "0.5"
hyper-util = "0.1"
tokio-stream = "0.1"
hostname = "0.4"
