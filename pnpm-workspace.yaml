# Concerto JS/TS monorepo (Phase 5, Task 507.5 — decision V8).
#
# `packages/*` holds the shared, transport-agnostic code: `@concerto/client`
# (generated proto types + the DataClient seam) consumed by web + mobile, and
# (Task 519) `@concerto/ui` (the extracted React-DOM renderer) consumed by
# desktop + web. `apps/web` (519) and `apps/mobile` (508) join as they are
# scaffolded. `apps/desktop` stays a standalone pnpm project for now (folded in
# when it migrates onto `@concerto/client`); its current build is unaffected.
packages:
  - 'packages/*'
  - 'apps/web'
